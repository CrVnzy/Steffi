<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;
            align-items: center;


            font-family:
                Arial,
                Helvetica,
                sans-serif;


            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow-1 {

            width: 320px;
            height: 320px;

            background: #ff2f68;

            top: -120px;
            left: -100px;
        }


        .glow-2 {

            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }



        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;


            width: min(700px, 90%);

            min-height: 540px;


            padding:
                60px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255, 255, 255, 0.07);


            border:
                1px solid
                rgba(255, 255, 255, 0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255, 255, 255, 0.02);


            animation:
                cardAppear 1s ease forwards;
        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }



        /* =====================================================
           TEXT
        ===================================================== */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        h1 {

            font-size:
                clamp(42px, 8vw, 75px);


            line-height: 1;


            margin-bottom: 25px;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .question-text {

            max-width: 520px;

            margin-bottom: 35px;


            color:
                rgba(255, 255, 255, 0.75);


            font-size: 18px;

            line-height: 1.7;
        }



        /* =====================================================
           BUTTON-BEREICH

           Beim ersten Laden liegen BEIDE Buttons
           nebeneinander und exakt mittig.
        ===================================================== */

        .button-area {

            width: 100%;

            min-height: 100px;


            display: flex;

            justify-content: center;

            align-items: center;


            gap: 24px;
        }



        /* =====================================================
           BUTTON GRUNDSTYLE
        ===================================================== */

        button {

            border: none;

            outline: none;


            font-family: inherit;

            font-size: 18px;

            font-weight: bold;


            border-radius: 999px;


            padding:
                17px 35px;


            cursor: pointer;


            user-select: none;
        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        #yesButton {

            position: relative;

            z-index: 3;


            transform:
                scale(1);


            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255, 47, 104, 0.35);


            transition:

                transform 0.35s ease,

                box-shadow 0.35s ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255, 47, 104, 0.55);
        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        #noButton {

            position: relative;

            z-index: 1000;


            color: white;


            background:

                rgba(255, 255, 255, 0.10);


            border:

                1px solid
                rgba(255, 255, 255, 0.18);


            transition:

                transform 0.15s ease,

                background 0.2s ease;
        }


        #noButton:hover {

            background:
                rgba(255, 255, 255, 0.16);


            transform:
                scale(1.05);
        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            position: absolute;

            bottom: 20px;


            color:
                rgba(255, 255, 255, 0.35);


            font-size: 13px;
        }



        /* =====================================================
           ERFOLGSSEITE
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;


            z-index: 5000;


            display: none;


            justify-content: center;

            align-items: center;


            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255, 47, 104, 0.25),
                    rgba(0, 0, 0, 0.96)
                );
        }


        .success-content {

            padding: 30px;


            animation:
                successAppear 1s ease forwards;
        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;


            animation:
                heartbeat 1s infinite;
        }


        .success h2 {

            font-size:
                clamp(45px, 9vw, 90px);


            margin-bottom: 20px;


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            font-size: 21px;


            color:
                rgba(255, 255, 255, 0.8);


            line-height: 1.7;
        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;


            bottom: -50px;


            z-index: 6000;


            pointer-events: none;


            font-size: 25px;


            animation:
                floatHeart 5s linear forwards;
        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-30px);
            }
        }


        @keyframes cardAppear {

            from {

                opacity: 0;


                transform:

                    translateY(35px)

                    scale(0.96);
            }


            to {

                opacity: 1;


                transform:

                    translateY(0)

                    scale(1);
            }
        }


        @keyframes successAppear {

            from {

                opacity: 0;


                transform:
                    scale(0.8);
            }


            to {

                opacity: 1;


                transform:
                    scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:

                    translateY(0)

                    rotate(0deg);


                opacity: 1;
            }


            100% {

                transform:

                    translateY(-110vh)

                    rotate(360deg);


                opacity: 0;
            }
        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;


                padding:
                    40px 20px;
            }


            .heart {

                font-size: 60px;
            }


            .question-text {

                font-size: 16px;

                margin-bottom: 25px;
            }


            .button-area {

                gap: 15px;
            }


            button {

                font-size: 16px;

                padding:
                    15px 27px;
            }


            .hint {

                bottom: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             BUTTONS

             Beide sind beim Start im Flex-Layout.
             Dadurch liegen sie exakt auf gleicher Höhe.
        ================================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >

                Ja ❤️

            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >

                Nein 🙈

            </button>

        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>

    </div>



    <!-- =====================================================
         ERFOLGSSEITE
    ===================================================== -->

    <div
        class="success"
        id="success"
    >


        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>


        </div>

    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;


        /*
         * Wie stark JA wächst.
         */

        const growthFactor = 1.10;


        /*
         * Maximale Größe von JA.
         */

        const maxYesScale = 2.6;


        /*
         * Sicherheitsabstand zwischen
         * JA und NEIN.
         */

        const safetyGap = 45;


        /*
         * Abstand vom Bildschirmrand.
         */

        const screenPadding = 15;



        /*
         * Damit NEIN nicht während
         * einer laufenden Flugbahn erneut
         * gestartet werden kann.
         */

        let isFlying = false;



        /* =====================================================
           NEIN-TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum nur? 😭",

            "Ich lauf dann mal weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           HILFSFUNKTION:

           Prüft, ob zwei Rechtecke sich überschneiden.
        ===================================================== */

        function rectanglesOverlap(
            a,
            b
        ) {

            return !(
                a.right < b.left ||
                a.left > b.right ||
                a.bottom < b.top ||
                a.top > b.bottom
            );

        }



        /* =====================================================
           HILFSFUNKTION:

           Prüft, ob ein LINENSEGMENT das Hindernis schneidet.

           Das Hindernis ist der JA-Button.
        ===================================================== */

        function lineIntersectsRect(
            p1,
            p2,
            rect
        ) {


            /*
             * Wenn Start oder Ende bereits
             * im Hindernis liegt → unsicher.
             */

            if (
                p1.x >= rect.left &&
                p1.x <= rect.right &&
                p1.y >= rect.top &&
                p1.y <= rect.bottom
            ) {
                return true;
            }


            if (
                p2.x >= rect.left &&
                p2.x <= rect.right &&
                p2.y >= rect.top &&
                p2.y <= rect.bottom
            ) {
                return true;
            }



            /*
             * Wir prüfen den Schnitt mit
             * allen vier Seiten.
             */

            function lineIntersectsLine(
                a,
                b,
                c,
                d
            ) {


                const denominator =

                    (d.y - c.y) *
                    (b.x - a.x)

                    -

                    (d.x - c.x) *
                    (b.y - a.y);


                if (
                    denominator === 0
                ) {
                    return false;
                }


                const ua =

                    (
                        (d.x - c.x) *
                        (a.y - c.y)

                        -

                        (d.y - c.y) *
                        (a.x - c.x)
                    )
                    /
                    denominator;


                const ub =

                    (
                        (b.x - a.x) *
                        (a.y - c.y)

                        -

                        (b.y - a.y) *
                        (a.x - c.x)
                    )
                    /
                    denominator;


                return (
                    ua >= 0 &&
                    ua <= 1 &&
                    ub >= 0 &&
                    ub <= 1
                );

            }



            const topLeft = {
                x: rect.left,
                y: rect.top
            };


            const topRight = {
                x: rect.right,
                y: rect.top
            };


            const bottomLeft = {
                x: rect.left,
                y: rect.bottom
            };


            const bottomRight = {
                x: rect.right,
                y: rect.bottom
            };



            return (

                lineIntersectsLine(
                    p1,
                    p2,
                    topLeft,
                    topRight
                )

                ||

                lineIntersectsLine(
                    p1,
                    p2,
                    topRight,
                    bottomRight
                )

                ||

                lineIntersectsLine(
                    p1,
                    p2,
                    bottomRight,
                    bottomLeft
                )

                ||

                lineIntersectsLine(
                    p1,
                    p2,
                    bottomLeft,
                    topLeft
                )

            );

        }



        /* =====================================================
           SICHEREN PFAD BERECHNEN

           Der JA Button ist das Hindernis.

           Der NEIN Button bekommt einen Flugweg
           um dieses Hindernis herum.
        ===================================================== */

        function calculateSafePath() {


            /*
             * JA-Button:
             * aktuelle, sichtbare Größe.
             */

            const yesRect =
                yesButton.getBoundingClientRect();



            /*
             * Größe NEIN.
             */

            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            /*
             * Aktuelles Rechteck von NEIN.
             */

            const noRect =
                noButton.getBoundingClientRect();



            /*
             * Wir arbeiten mit dem Mittelpunkt
             * des NEIN Buttons.
             */

            const start = {

                x:
                    noRect.left +
                    noRect.width / 2,

                y:
                    noRect.top +
                    noRect.height / 2

            };



            /*
             * Zufälliges Ziel.
             */

            const target = {


                x:

                    screenPadding
                    +

                    Math.random()
                    *
                    (
                        window.innerWidth
                        -
                        noWidth
                        -
                        screenPadding * 2
                    )


                    +

                    noWidth / 2,


                y:

                    screenPadding
                    +

                    Math.random()
                    *
                    (
                        window.innerHeight
                        -
                        noHeight
                        -
                        screenPadding * 2
                    )


                    +

                    noHeight / 2

            };



            /*
             * JA-Rechteck vergrößern.

             * Dadurch muss der MITTELPUNKT
             * von NEIN zusätzlich Abstand
             * halten, damit die komplette
             * Buttonfläche nicht mit JA kollidiert.
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safetyGap,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safetyGap,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safetyGap,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safetyGap

            };



            /*
             * Prüfen:

             * Direkter Weg möglich?
             */

            if (
                !lineIntersectsRect(
                    start,
                    target,
                    obstacle
                )
            ) {

                return [
                    start,
                    target
                ];

            }



            /*
             * Wenn der direkte Weg nicht geht,
             * bauen wir vier sichere Eckpunkte
             * um JA herum.
             */

            const margin = 12;


            const corners = [

                /*
                 * Oben links
                 */

                {
                    x:
                        obstacle.left - margin,

                    y:
                        obstacle.top - margin
                },


                /*
                 * Oben rechts
                 */

                {
                    x:
                        obstacle.right + margin,

                    y:
                        obstacle.top - margin
                },


                /*
                 * Unten rechts
                 */

                {
                    x:
                        obstacle.right + margin,

                    y:
                        obstacle.bottom + margin
                },


                /*
                 * Unten links
                 */

                {
                    x:
                        obstacle.left - margin,

                    y:
                        obstacle.bottom + margin
                }

            ];



            /*
             * Nur Punkte behalten,
             * die innerhalb des Bildschirms liegen.
             */

            const validCorners =
                corners.filter(
                    point => (

                        point.x >= screenPadding &&

                        point.x <=
                            window.innerWidth
                            -
                            screenPadding &&

                        point.y >= screenPadding &&

                        point.y <=
                            window.innerHeight
                            -
                            screenPadding

                    )
                );



            /*
             * Kandidaten für den Pfad.

             * Start
             * Ecken
             * Ziel
             */

            const nodes = [

                start,

                ...validCorners,

                target

            ];



            /*
             * Einfachster Weg:
             *
             * Wir probieren alle möglichen
             * Knotenverbindungen und wählen
             * den kürzesten validen Weg.
             */

            const graph =
                nodes.map(
                    () => []
                );



            for (
                let i = 0;
                i < nodes.length;
                i++
            ) {


                for (
                    let j = i + 1;
                    j < nodes.length;
                    j++
                ) {


                    const a =
                        nodes[i];

                    const b =
                        nodes[j];


                    /*
                     * Ist die Verbindung
                     * frei vom JA-Button?
                     */

                    if (
                        !lineIntersectsRect(
                            a,
                            b,
                            obstacle
                        )
                    ) {


                        const distance =

                            Math.hypot(
                                b.x - a.x,
                                b.y - a.y
                            );


                        graph[i].push({
                            node: j,
                            distance
                        });


                        graph[j].push({
                            node: i,
                            distance
                        });

                    }

                }

            }



            /*
             * Dijkstra / kürzester Weg.
             */

            const distances =
                Array(nodes.length)
                .fill(Infinity);


            const previous =
                Array(nodes.length)
                .fill(null);


            const visited =
                Array(nodes.length)
                .fill(false);


            distances[0] = 0;



            for (
                let step = 0;
                step < nodes.length;
                step++
            ) {


                let current = -1;


                let smallest =
                    Infinity;


                for (
                    let i = 0;
                    i < nodes.length;
                    i++
                ) {


                    if (
                        !visited[i] &&
                        distances[i] < smallest
                    ) {

                        smallest =
                            distances[i];

                        current = i;

                    }

                }


                if (
                    current === -1
                ) {

                    break;

                }


                visited[current] = true;



                for (
                    const edge
                    of graph[current]
                ) {


                    const newDistance =

                        distances[current]
                        +
                        edge.distance;


                    if (
                        newDistance
                        <
                        distances[edge.node]
                    ) {

                        distances[edge.node] =
                            newDistance;


                        previous[edge.node] =
                            current;

                    }

                }

            }



            /*
             * Ziel ist der letzte Node.
             */

            const path = [];


            let current =
                nodes.length - 1;


            while (
                current !== null
                &&
                current !== undefined
            ) {


                path.unshift(
                    nodes[current]
                );


                current =
                    previous[current];

            }



            /*
             * Falls kein Weg gefunden wurde,
             * benutzen wir den direkten Weg.

             * Das sollte nur passieren,
             * wenn der JA Button nahezu
             * den kompletten Bildschirm
             * einnimmt.
             */

            if (
                path.length === 0
            ) {

                return [
                    start,
                    target
                ];

            }


            return path;

        }



        /* =====================================================
           FLUG ENTLANG DES PFADES
        ===================================================== */

        function flyAlongPath(
            path
        ) {


            if (
                path.length < 2
            ) {

                isFlying = false;

                noButton.style.pointerEvents =
                    "auto";

                return;

            }



            /*
             * Gesamtstrecke berechnen.
             */

            let totalDistance = 0;


            for (
                let i = 1;
                i < path.length;
                i++
            ) {


                totalDistance +=

                    Math.hypot(

                        path[i].x
                        -
                        path[i - 1].x,

                        path[i].y
                        -
                        path[i - 1].y

                    );

            }



            /*
             * Fluggeschwindigkeit.

             * Je länger der Weg,
             * desto länger der Flug.
             */

            const duration =

                Math.min(
                    1600,
                    Math.max(
                        650,
                        totalDistance * 1.1
                    )
                );



            const startTime =
                performance.now();



            /*
             * Animation.
             */

            function animate(
                currentTime
            ) {


                const elapsed =
                    currentTime
                    -
                    startTime;


                let progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );



                /*
                 * Smoothstep / Ease-In-Out.

                 * Dadurch startet und endet
                 * der Button schön weich.
                 */

                const eased =

                    progress
                    <
                    0.5

                        ?

                    2 *
                    progress *
                    progress

                        :

                    1
                    -
                    Math.pow(
                        -2 * progress + 2,
                        2
                    )
                    /
                    2;



                /*
                 * Position entlang
                 * des gesamten Pfades bestimmen.
                 */

                const desiredDistance =
                    totalDistance * eased;


                let travelled = 0;


                let x =
                    path[0].x;


                let y =
                    path[0].y;



                for (
                    let i = 1;
                    i < path.length;
                    i++
                ) {


                    const segmentLength =

                        Math.hypot(

                            path[i].x
                            -
                            path[i - 1].x,

                            path[i].y
                            -
                            path[i - 1].y

                        );



                    if (
                        travelled
                        +
                        segmentLength
                        >=
                        desiredDistance
                    ) {


                        const segmentProgress =

                            (
                                desiredDistance
                                -
                                travelled
                            )
                            /
                            segmentLength;


                        x =

                            path[i - 1].x
                            +

                            (
                                path[i].x
                                -
                                path[i - 1].x
                            )
                            *
                            segmentProgress;


                        y =

                            path[i - 1].y
                            +

                            (
                                path[i].y
                                -
                                path[i - 1].y
                            )
                            *
                            segmentProgress;


                        break;

                    }


                    travelled +=
                        segmentLength;

                }



                /*
                 * Button position setzen.

                 * Wir arbeiten mit dem Mittelpunkt.
                 */

                noButton.style.left =
                    `${x - noButton.offsetWidth / 2}px`;


                noButton.style.top =
                    `${y - noButton.offsetHeight / 2}px`;



                /*
                 * Beim Fliegen ein klein
                 * wenig drehen.
                 */

                const rotation =
                    Math.sin(
                        progress * Math.PI * 4
                    )
                    * 6;


                noButton.style.transform =
                    `rotate(${rotation}deg)`;



                /*
                 * Noch nicht fertig?
                 */

                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }
                else {

                    /*
                     * Flug beendet.
                     */

                    noButton.style.transform =
                        "rotate(0deg)";


                    isFlying = false;


                    noButton.style.pointerEvents =
                        "auto";

                }

            }


            requestAnimationFrame(
                animate
            );

        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        function sayNo() {


            /*
             * Während eines Fluges
             * nicht mehrfach auslösen.
             */

            if (
                isFlying
            ) {

                return;

            }


            isFlying = true;


            noButton.style.pointerEvents =
                "none";



            noClicks++;



            /* =================================================
               AKTUELLE POSITION MERKEN

               Bevor wir position: fixed setzen,
               merken wir uns die aktuelle
               Bildschirmposition.
            ================================================= */

            const currentRect =
                noButton.getBoundingClientRect();


            noButton.style.position =
                "fixed";


            noButton.style.left =
                `${currentRect.left}px`;


            noButton.style.top =
                `${currentRect.top}px`;



            /*
             * JA größer machen.
             */

            yesScale *=
                growthFactor;


            if (
                yesScale > maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }


            yesButton.style.transform =
                `
                translate(-50%, -50%)
                scale(${yesScale})
                `;



            /*
             * Text des NEIN Buttons.
             */

            const textIndex =

                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * WICHTIG:

             * Erst wenn JA seine neue Größe
             * erreicht hat, berechnen wir
             * die Flugbahn.

             * Dadurch basiert der Sicherheitsabstand
             * auf der tatsächlichen endgültigen
             * Größe von JA.
             */

            setTimeout(
                () => {

                    const path =
                        calculateSafePath();


                    flyAlongPath(
                        path
                    );

                },

                360
            );

        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        function sayYes() {


            /*
             * Karte verstecken.
             */

            document
                .getElementById(
                    "mainCard"
                )
                .style.display =
                "none";


            /*
             * NEIN verstecken.
             */

            noButton.style.display =
                "none";


            /*
             * Erfolg zeigen.
             */

            document
                .getElementById(
                    "success"
                )
                .style.display =
                "flex";


            /*
             * Herzen erzeugen.
             */

            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(
                    () => {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.className =
                            "floating-heart";


                        heart.innerText =

                            heartTypes[
                                Math.floor(
                                    Math.random()
                                    *
                                    heartTypes.length
                                )
                            ];


                        heart.style.left =

                            Math.random()
                            * 100
                            +
                            "vw";


                        heart.style.fontSize =

                            (
                                18
                                +
                                Math.random()
                                * 25
                            )
                            +
                            "px";


                        heart.style.animationDuration =

                            (
                                3
                                +
                                Math.random()
                                * 3
                            )
                            +
                            "s";


                        document.body.appendChild(
                            heart
                        );


                        setTimeout(
                            () => {

                                heart.remove();

                            },

                            6500
                        );


                    },

                    i * 80
                );

            }

        }



        /* =====================================================
           START

           Nichts berechnen!

           Der Button liegt durch Flexbox automatisch
           exakt neben JA und auf gleicher Höhe.
        ===================================================== */

        window.addEventListener(
            "load",
            () => {

                /*
                 * Absichtlich leer.

                 * NEIN bleibt ganz normal
                 * neben JA.
                 */

            }
        );



        /* =====================================================
           FENSTERGRÖSSE

           Wenn während eines bereits gestarteten
           Spiels das Browserfenster verändert wird,
           wird keine unnötige Bewegung ausgelöst.
        ===================================================== */

    </script>
