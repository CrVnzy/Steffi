<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow-1 {

            width: 320px;
            height: 320px;

            top: -120px;
            left: -100px;

            background: #ff2f68;
        }


        .glow-2 {

            width: 320px;
            height: 320px;

            right: -100px;
            bottom: -100px;

            background: #9c27ff;

            animation-delay: 2s;
        }



        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;

            width: min(700px, 92%);

            min-height: 540px;

            padding:
                55px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255, 255, 255, 0.07);


            border:
                1px solid
                rgba(255, 255, 255, 0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255, 255, 255, 0.02);


            animation:
                cardAppear 1s ease;
        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 70px;

            margin-bottom: 18px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }



        /* =====================================================
           KLEINER TEXT
        ===================================================== */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }



        /* =====================================================
           TITEL
        ===================================================== */

        h1 {

            margin-bottom: 25px;

            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }



        /* =====================================================
           TEXT
        ===================================================== */

        .question-text {

            max-width: 520px;

            margin-bottom: 25px;


            color:
                rgba(255, 255, 255, 0.75);


            font-size: 18px;

            line-height: 1.7;
        }



        /* =====================================================
           FLUGBEREICH

           WICHTIG:

           Der NEIN Button darf sich NUR innerhalb
           dieses Bereichs bewegen.

           Nicht über den kompletten Bildschirm.
        ===================================================== */

        .button-stage {

            position: relative;

            width: 100%;

            max-width: 600px;

            height: 190px;

            margin-top: 5px;

            overflow: hidden;

            border-radius: 25px;

        }



        /* =====================================================
           BUTTON
        ===================================================== */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;


            border-radius: 999px;


            padding:
                17px 35px;


            cursor: pointer;

            user-select: none;

            white-space: nowrap;
        }



        /* =====================================================
           JA

           Bleibt IMMER in der Mitte.
        ===================================================== */

        #yesButton {

            position: absolute;

            z-index: 10;


            left: 42%;

            top: 50%;


            transform:

                translate(
                    -50%,
                    -50%
                )

                scale(1);


            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255, 47, 104, 0.35);


            transition:
                transform 0.35s ease,
                box-shadow 0.3s ease;

        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255, 47, 104, 0.55);

        }



        /* =====================================================
           NEIN

           WICHTIG:

           Er ist von ANFANG AN absolute.

           Dadurch gibt es beim ersten Klick
           KEINEN Wechsel von relative -> fixed.

           Genau dadurch verschwindet er nicht mehr.
        ===================================================== */

        #noButton {

            position: absolute;

            z-index: 20;


            left: 58%;

            top: 50%;


            transform:

                translate(
                    -50%,
                    -50%
                );


            color: white;


            background:
                rgba(255,255,255,0.10);


            border:
                1px solid
                rgba(255,255,255,0.18);


            /*
             * JavaScript übernimmt die Bewegung.

             * Deshalb KEINE left/top transition.
             */

            transition:
                background 0.2s ease;
        }


        #noButton:hover {

            background:
                rgba(255,255,255,0.16);

        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            margin-top: 10px;

            color:
                rgba(255,255,255,0.35);

            font-size: 13px;
        }



        /* =====================================================
           ERFOLG
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;

            z-index: 5000;


            display: none;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255,47,104,0.25),
                    rgba(0,0,0,0.96)
                );
        }


        .success-content {

            padding: 30px;

            animation:
                successAppear 1s ease;
        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;


            animation:
                heartbeat 1s infinite;
        }


        .success h2 {

            margin-bottom: 20px;

            font-size:
                clamp(45px,9vw,90px);


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            color:
                rgba(255,255,255,0.8);

            font-size: 21px;

            line-height: 1.7;
        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;


            font-size: 25px;


            animation:
                floatHeart 5s linear forwards;
        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.15);
            }

        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-30px);
            }

        }


        @keyframes cardAppear {

            from {

                opacity: 0;


                transform:
                    translateY(35px)
                    scale(0.96);

            }


            to {

                opacity: 1;


                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes successAppear {

            from {

                opacity: 0;


                transform:
                    scale(0.8);

            }


            to {

                opacity: 1;


                transform:
                    scale(1);

            }

        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;

            }


            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;

            }

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;

                padding:
                    40px 18px;

            }


            .heart {

                font-size: 60px;

            }


            .question-text {

                font-size: 16px;

            }


            .button-stage {

                height: 180px;

            }


            #yesButton {

                left: 38%;

            }


            #noButton {

                left: 65%;

            }


            button {

                font-size: 16px;

                padding:
                    15px 24px;

            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             BEGRENZTER FLUGBEREICH
        ================================================== -->

        <div
            class="button-stage"
            id="buttonStage"
        >


            <!-- JA -->

            <button
                id="yesButton"
                onclick="sayYes()"
            >

                Ja ❤️

            </button>



            <!-- NEIN -->

            <button
                id="noButton"
                onclick="sayNo()"
            >

                Nein 🙈

            </button>


        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>

    </div>



    <!-- =====================================================
         ERFOLG
    ===================================================== -->

    <div
        class="success"
        id="success"
    >


        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>


        </div>

    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const stage =
            document.getElementById(
                "buttonStage"
            );


        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =====================================================
           VARIABLEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;

        let isFlying = false;



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        /*
         * JA wächst um 10%.
         */

        const growth =
            1.10;


        /*
         * Maximale Größe von JA.
         */

        const maxYesScale =
            2.15;


        /*
         * Sicherheitsabstand
         * zwischen den Buttons.
         */

        const safetyGap =
            30;


        /*
         * Abstand zum Rand
         * des FLUGBEREICHS.
         */

        const stagePadding =
            10;



        /* =====================================================
           NEIN-TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich lauf weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           RECHTECK
        ===================================================== */

        function createRect(
            x,
            y,
            width,
            height
        ) {

            return {

                left: x,

                top: y,

                right:
                    x + width,

                bottom:
                    y + height

            };

        }



        /* =====================================================
           RECHTECKE ÜBERSCHNEIDEN
        ===================================================== */

        function overlaps(
            a,
            b,
            gap
        ) {

            return (

                a.left
                <
                b.right + gap

                &&

                a.right
                >
                b.left - gap

                &&

                a.top
                <
                b.bottom + gap

                &&

                a.bottom
                >
                b.top - gap

            );

        }



        /* =====================================================
           BEREICH INNERHALB STAGE
        ===================================================== */

        function insideStage(
            rect
        ) {

            const width =
                stage.clientWidth;

            const height =
                stage.clientHeight;


            return (

                rect.left
                >=
                stagePadding

                &&

                rect.top
                >=
                stagePadding

                &&

                rect.right
                <=
                width
                -
                stagePadding

                &&

                rect.bottom
                <=
                height
                -
                stagePadding

            );

        }



        /* =====================================================
           JA RECHTECK IN STAGE-KOORDINATEN
        ===================================================== */

        function getYesRectInStage() {

            const stageRect =
                stage.getBoundingClientRect();


            const yesRect =
                yesButton.getBoundingClientRect();


            return {

                left:
                    yesRect.left
                    -
                    stageRect.left,

                top:
                    yesRect.top
                    -
                    stageRect.top,

                right:
                    yesRect.right
                    -
                    stageRect.left,

                bottom:
                    yesRect.bottom
                    -
                    stageRect.top

            };

        }



        /* =====================================================
           NEIN AKTUELLE POSITION
        ===================================================== */

        function getNoCenter() {

            const noRect =
                noButton.getBoundingClientRect();


            const stageRect =
                stage.getBoundingClientRect();


            return {

                x:
                    noRect.left
                    -
                    stageRect.left
                    +
                    noRect.width / 2,

                y:
                    noRect.top
                    -
                    stageRect.top
                    +
                    noRect.height / 2

            };

        }



        /* =====================================================
           PRÜFEN OB EIN KOMPLETTER PUNKT
           ZU NAH AN JA IST
        ===================================================== */

        function pointInsideObstacle(
            point,
            obstacle
        ) {

            return (

                point.x
                >=
                obstacle.left

                &&

                point.x
                <=
                obstacle.right

                &&

                point.y
                >=
                obstacle.top

                &&

                point.y
                <=
                obstacle.bottom

            );

        }



        /* =====================================================
           BEWEGUNGSWEG PRÜFEN

           Wir testen eine kurvige Bewegung,
           nicht nur Start und Ende.

           Dadurch kann NEIN während des Fluges
           nicht durch JA fliegen.
        ===================================================== */

        function pathIsSafe(
            start,
            control,
            end
        ) {

            const yesRect =
                getYesRectInStage();


            const noWidth =
                noButton.offsetWidth;


            const noHeight =
                noButton.offsetHeight;


            /*
             * JA um die komplette NEIN-Größe
             * und Sicherheitsabstand erweitern.
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safetyGap,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safetyGap,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safetyGap,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safetyGap

            };


            /*
             * 180 Punkte entlang
             * der Bezier-Kurve testen.
             */

            for (
                let i = 0;
                i <= 180;
                i++
            ) {

                const t =
                    i / 180;


                /*
                 * Quadratische Bezier-Kurve.
                 */

                const x =

                    Math.pow(
                        1 - t,
                        2
                    )
                    * start.x

                    +

                    2 *
                    (
                        1 - t
                    ) *
                    t *
                    control.x

                    +

                    Math.pow(
                        t,
                        2
                    )
                    * end.x;


                const y =

                    Math.pow(
                        1 - t,
                        2
                    )
                    * start.y

                    +

                    2 *
                    (
                        1 - t
                    ) *
                    t *
                    control.y

                    +

                    Math.pow(
                        t,
                        2
                    )
                    * end.y;



                /*
                 * NEIN-Button an dieser Stelle.
                 */

                const noRect =

                    createRect(

                        x - noWidth / 2,

                        y - noHeight / 2,

                        noWidth,

                        noHeight

                    );



                /*
                 * Innerhalb der Stage?
                 */

                if (
                    !insideStage(
                        noRect
                    )
                ) {

                    return false;

                }



                /*
                 * JA berührt?
                 */

                if (
                    overlaps(
                        noRect,
                        yesRect,
                        safetyGap
                    )
                ) {

                    return false;

                }

            }


            return true;

        }



        /* =====================================================
           SICHERES ZIEL + KONTROLLPUNKT SUCHEN
        ===================================================== */

        function findSafeFlight() {


            const start =
                getNoCenter();


            const width =
                noButton.offsetWidth;


            const height =
                noButton.offsetHeight;



            /*
             * 5000 Möglichkeiten ausprobieren.
             */

            for (
                let attempt = 0;
                attempt < 5000;
                attempt++
            ) {


                /*
                 * Zielpunkt innerhalb der Stage.
                 */

                const end = {

                    x:

                        stagePadding
                        +
                        width / 2
                        +
                        Math.random()
                        *
                        (
                            stage.clientWidth
                            -
                            2 *
                            stagePadding
                            -
                            width
                        ),

                    y:

                        stagePadding
                        +
                        height / 2
                        +
                        Math.random()
                        *
                        (
                            stage.clientHeight
                            -
                            2 *
                            stagePadding
                            -
                            height
                        )

                };



                /*
                 * Kontrollpunkt.

                 * Dadurch wird die Bewegung
                 * leicht gebogen.
                 */

                const control = {

                    x:

                        stage.clientWidth
                        *
                        (
                            0.2
                            +
                            Math.random()
                            *
                            0.6
                        ),

                    y:

                        stage.clientHeight
                        *
                        (
                            0.15
                            +
                            Math.random()
                            *
                            0.7
                        )

                };



                /*
                 * Route überprüfen.
                 */

                if (
                    pathIsSafe(
                        start,
                        control,
                        end
                    )
                ) {

                    return {

                        start,
                        control,
                        end

                    };

                }

            }


            /*
             * Kein sicherer Weg gefunden.
             */

            return null;

        }



        /* =====================================================
           BEZIER POSITION
        ===================================================== */

        function getBezierPoint(
            start,
            control,
            end,
            t
        ) {

            return {

                x:

                    Math.pow(
                        1 - t,
                        2
                    )
                    *
                    start.x

                    +

                    2 *
                    (
                        1 - t
                    )
                    *
                    t
                    *
                    control.x

                    +

                    Math.pow(
                        t,
                        2
                    )
                    *
                    end.x,


                y:

                    Math.pow(
                        1 - t,
                        2
                    )
                    *
                    start.y

                    +

                    2 *
                    (
                        1 - t
                    )
                    *
                    t
                    *
                    control.y

                    +

                    Math.pow(
                        t,
                        2
                    )
                    *
                    end.y

            };

        }



        /* =====================================================
           SMOOTH FLUG
        ===================================================== */

        function flyNoButton(
            route
        ) {


            const startTime =
                performance.now();


            /*
             * Flugzeit.
             */

            const duration =
                900 +
                Math.random() * 400;


            /*
             * ANIMATION
             */

            function animate(
                now
            ) {


                const elapsed =
                    now -
                    startTime;


                let t =
                    elapsed / duration;


                if (
                    t > 1
                ) {

                    t = 1;

                }



                /*
                 * Sehr sanftes
                 * Ease-In-Out.
                 */

                const eased =

                    t < 0.5

                        ?

                    2 *
                    t *
                    t

                        :

                    1 -
                    Math.pow(
                        -2 * t + 2,
                        2
                    )
                    /
                    2;



                /*
                 * Punkt auf der Kurve.
                 */

                const point =

                    getBezierPoint(

                        route.start,

                        route.control,

                        route.end,

                        eased

                    );



                /*
                 * Button bewegen.
                 */

                noButton.style.left =

                    (
                        point.x
                        -
                        noButton.offsetWidth
                        / 2
                    )
                    +
                    "px";


                noButton.style.top =

                    (
                        point.y
                        -
                        noButton.offsetHeight
                        / 2
                    )
                    +
                    "px";



                /*
                 * Leichtes Schwingen.
                 */

                const rotation =

                    Math.sin(
                        eased
                        *
                        Math.PI
                        *
                        3
                    )
                    *
                    4;


                noButton.style.transform =

                    `translate(-50%, -50%) rotate(${rotation}deg)`;



                /*
                 * Weiter?
                 */

                if (
                    t < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    noButton.style.transform =
                        "translate(-50%, -50%)";

                    isFlying = false;

                }

            }


            requestAnimationFrame(
                animate
            );

        }



        /* =====================================================
           NEIN GEKLICKT
        ===================================================== */

        function sayNo() {


            /*
             * Während des Fluges
             * keinen weiteren Klick.
             */

            if (
                isFlying
            ) {

                return;

            }


            isFlying = true;


            noClicks++;



            /*
             * JA größer.
             */

            yesScale *=
                growth;


            if (
                yesScale >
                maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }


            yesButton.style.transform =

                `
                translate(-50%, -50%)
                scale(${yesScale})
                `;



            /*
             * NEIN Text wechseln.
             */

            const textIndex =
                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * Warten, bis JA tatsächlich
             * größer geworden ist.
             */

            requestAnimationFrame(
                () => {


                    /*
                     * Sichere Route suchen.
                     */

                    const route =
                        findSafeFlight();



                    /*
                     * Route gefunden?
                     */

                    if (
                        route === null
                    ) {

                        isFlying = false;

                        return;

                    }



                    /*
                     * FLIEGEN! 🚀
                     */

                    flyNoButton(
                        route
                    );

                }
            );

        }



        /* =====================================================
           JA GEKLICKT
        ===================================================== */

        function sayYes() {


            document
                .getElementById(
                    "mainCard"
                )
                .style.display =
                "none";


            noButton.style.display =
                "none";


            document
                .getElementById(
                    "success"
                )
                .style.display =
                "flex";


            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(
                    () => {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.className =
                            "floating-heart";


                        heart.innerText =

                            hearts[
                                Math.floor(
                                    Math.random()
                                    *
                                    hearts.length
                                )
                            ];


                        heart.style.left =

                            Math.random()
                            *
                            100
                            +
                            "vw";


                        heart.style.fontSize =

                            (
                                18
                                +
                                Math.random()
                                *
                                25
                            )
                            +
                            "px";


                        heart.style.animationDuration =

                            (
                                3
                                +
                                Math.random()
                                *
                                3
                            )
                            +
                            "s";


                        document.body.appendChild(
                            heart
                        );


                        setTimeout(
                            () => {

                                heart.remove();

                            },

                            6500
                        );


                    },

                    i * 70
                );

            }

        }

    </script>
