<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =========================================
           GRUNDLAGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }



        /* =========================================
           HINTERGRUND
        ========================================= */

        .background-glow {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow-1 {

            width: 320px;
            height: 320px;

            background: #ff2f68;

            top: -120px;
            left: -100px;
        }


        .glow-2 {

            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }



        /* =========================================
           HAUPTKARTE
        ========================================= */

        .card {

            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            min-height: 540px;

            padding:
                60px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255, 255, 255, 0.07);


            border:
                1px solid
                rgba(255, 255, 255, 0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255, 255, 255, 0.02);


            animation:
                cardAppear 1s ease forwards;
        }



        /* =========================================
           HERZ
        ========================================= */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }



        /* =========================================
           TEXT
        ========================================= */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        h1 {

            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;

            margin-bottom: 25px;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .question-text {

            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 18px;

            line-height: 1.7;
        }



        /* =========================================
           BUTTON BEREICH

           WICHTIG:

           Beim ersten Laden sind BEIDE Buttons
           ganz normal nebeneinander.

           Erst nach dem ersten NEIN-Klick
           wird NEIN "fixed".
        ========================================= */

        .button-area {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            width: 100%;

            min-height: 100px;
        }



        /* =========================================
           ALLGEMEINE BUTTONS
        ========================================= */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 999px;

            padding:
                17px 35px;

            cursor: pointer;

            user-select: none;
        }



        /* =========================================
           JA BUTTON
        ========================================= */

        #yesButton {

            position: relative;

            z-index: 3;


            transform: scale(1);

            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255, 47, 104, 0.35);


            transition:

                transform 0.30s ease,

                box-shadow 0.30s ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255, 47, 104, 0.55);
        }



        /* =========================================
           NEIN BUTTON

           WICHTIG:

           Standardmäßig ist er "relative".

           Somit liegt er beim ersten Öffnen
           automatisch neben JA.

           JavaScript macht daraus erst beim
           ersten NEIN-Klick "fixed".
        ========================================= */

        #noButton {

            position: relative;

            z-index: 1000;


            color: white;


            background:

                rgba(255, 255, 255, 0.10);


            border:

                1px solid
                rgba(255, 255, 255, 0.18);


            transition:

                transform 0.15s ease,

                opacity 0.15s ease,

                background 0.2s ease;
        }


        #noButton:hover {

            background:
                rgba(255, 255, 255, 0.16);

            transform:
                scale(1.05);
        }



        /* =========================================
           HINWEIS
        ========================================= */

        .hint {

            position: absolute;

            bottom: 20px;

            color:
                rgba(255, 255, 255, 0.35);

            font-size: 13px;
        }



        /* =========================================
           ERFOLG
        ========================================= */

        .success {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            justify-content: center;

            align-items: center;

            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255, 47, 104, 0.25),
                    rgba(0, 0, 0, 0.96)
                );
        }


        .success-content {

            padding: 30px;

            animation:
                successAppear 1s ease forwards;
        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;

            animation:
                heartbeat 1s infinite;
        }


        .success h2 {

            font-size:
                clamp(45px, 9vw, 90px);

            margin-bottom: 20px;


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            font-size: 21px;

            color:
                rgba(255, 255, 255, 0.8);

            line-height: 1.7;
        }



        /* =========================================
           HERZEN
        ========================================= */

        .floating-heart {

            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;

            font-size: 25px;

            animation:
                floatHeart 5s linear forwards;
        }



        /* =========================================
           ANIMATIONEN
        ========================================= */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-30px);
            }
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.8);
            }


            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }


            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }



        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;
            }


            .heart {

                font-size: 60px;
            }


            .question-text {

                font-size: 16px;

                margin-bottom: 25px;
            }


            .button-area {

                gap: 15px;
            }


            button {

                font-size: 16px;

                padding:
                    15px 27px;
            }


            .hint {

                bottom: 15px;
            }
        }

    </style>

</head>



<body>


    <!-- =========================================
         HINTERGRUND
    ========================================= -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =========================================
         HAUPTKARTE
    ========================================= -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =====================================
             BEIDE BUTTONS LIEGEN AM ANFANG
             DIREKT NEBENEINANDER
        ====================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >

                Ja ❤️

            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >

                Nein 🙈

            </button>

        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>

    </div>



    <!-- =========================================
         ERFOLGSSEITE
    ========================================= -->

    <div
        class="success"
        id="success"
    >

        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>

        </div>

    </div>



    <script>


        /* =========================================
           ELEMENTE
        ========================================= */

        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =========================================
           EINSTELLUNGEN
        ========================================= */

        let yesScale = 1;

        let noClicks = 0;


        /*
         * JA wächst um 10 % pro NEIN.
         */

        const growthFactor = 1.10;


        /*
         * Maximale Größe:
         * 260 %
         */

        const maxYesScale = 2.6;


        /*
         * Sicherheitsabstand.
         *
         * NEIN muss mindestens
         * 40 Pixel Abstand zu JA haben.
         */

        const safetyGap = 40;


        /*
         * Abstand zum Bildschirmrand.
         */

        const screenPadding = 15;



        /* =========================================
           NEIN-TEXTE
        ========================================= */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Du musst schon schneller sein 😂",

            "Ich lauf dann mal weg 🙈"

        ];



        /* =========================================
           KOLLISIONSPRÜFUNG
        ========================================= */

        function isOverlapping(
            rectA,
            rectB,
            gap
        ) {

            return !(
                rectA.right + gap < rectB.left ||
                rectA.left - gap > rectB.right ||
                rectA.bottom + gap < rectB.top ||
                rectA.top - gap > rectB.bottom
            );

        }



        /* =========================================
           SICHERE POSITION SUCHEN
        ========================================= */

        function findSafePosition() {


            /*
             * AKTUELLE sichtbare Größe
             * des JA Buttons.
             *
             * Das berücksichtigt auch
             * scale().
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Größe des NEIN Buttons.

             * Wir brauchen seine Größe,
             * bevor wir die Position wählen.
             */

            const noWidth =
                noButton.offsetWidth;


            const noHeight =
                noButton.offsetHeight;



            /*
             * Bildschirmgrenzen.
             */

            const maxX =
                window.innerWidth
                - noWidth
                - screenPadding;


            const maxY =
                window.innerHeight
                - noHeight
                - screenPadding;



            /*
             * 5000 zufällige Versuche.
             */

            for (
                let attempt = 0;
                attempt < 5000;
                attempt++
            ) {


                const x =
                    screenPadding +
                    Math.random() *
                    Math.max(
                        0,
                        maxX - screenPadding
                    );


                const y =
                    screenPadding +
                    Math.random() *
                    Math.max(
                        0,
                        maxY - screenPadding
                    );



                /*
                 * Mögliches Rechteck
                 * des NEIN Buttons.
                 */

                const candidate = {

                    left: x,

                    top: y,

                    right:
                        x + noWidth,

                    bottom:
                        y + noHeight

                };



                /*
                 * JA vs. NEIN prüfen.
                 */

                if (
                    !isOverlapping(
                        candidate,
                        yesRect,
                        safetyGap
                    )
                ) {

                    return {
                        x,
                        y
                    };

                }

            }



            /*
             * Sicherheits-Fallback:
             * Systematische Suche.
             */

            const step = 10;


            for (
                let y = screenPadding;
                y <= maxY;
                y += step
            ) {

                for (
                    let x = screenPadding;
                    x <= maxX;
                    x += step
                ) {


                    const candidate = {

                        left: x,

                        top: y,

                        right:
                            x + noWidth,

                        bottom:
                            y + noHeight

                    };


                    if (
                        !isOverlapping(
                            candidate,
                            yesRect,
                            safetyGap
                        )
                    ) {

                        return {
                            x,
                            y
                        };

                    }

                }

            }


            return null;

        }



        /* =========================================
           NEIN BUTTON BEWEGEN
        ========================================= */

        function moveNoButton() {


            const position =
                findSafePosition();


            if (
                position === null
            ) {

                return;

            }


            /*
             * Jetzt wird NEIN
             * sofort aus seinem normalen
             * Layout genommen.
             */

            noButton.style.position =
                "fixed";


            /*
             * GANZ WICHTIG:

             * Keine left/top transition.

             * Der Button springt direkt
             * auf die neue Position.
             */

            noButton.style.left =
                `${position.x}px`;


            noButton.style.top =
                `${position.y}px`;

        }



        /* =========================================
           NEIN GEKLICKT
        ========================================= */

        function sayNo() {


            noClicks++;


            /*
             * =====================================
             * 1. JA VERGRÖSSERN
             * =====================================
             */

            yesScale *= growthFactor;


            if (
                yesScale > maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }


            yesButton.style.transform =

                `
                scale(${yesScale})
                `;



            /*
             * =====================================
             * 2. NEIN-TEXT ÄNDERN
             * =====================================
             */

            const textIndex =

                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * =====================================
             * 3. KURZ AUF BROWSER WARTEN
             *
             * Der JA Button muss zuerst
             * tatsächlich größer werden.
             * Erst danach berechnen wir
             * die sichere Position.
             * =====================================
             */

            requestAnimationFrame(() => {


                /*
                 * Beim ERSTEN Klick wird NEIN
                 * von "normal neben JA"
                 * zu "fixed".
                 */

                noButton.style.position =
                    "fixed";


                /*
                 * Erst jetzt eine sichere
                 * Position für den gesamten
                 * Bildschirm suchen.
                 */

                const position =
                    findSafePosition();


                if (
                    position !== null
                ) {

                    /*
                     * SOFORT teleportieren.
                     */

                    noButton.style.left =
                        `${position.x}px`;


                    noButton.style.top =
                        `${position.y}px`;

                }

            });

        }



        /* =========================================
           JA GEKLICKT
        ========================================= */

        function sayYes() {


            /*
             * Hauptkarte entfernen.
             */

            document
                .getElementById("mainCard")
                .style.display = "none";


            /*
             * NEIN verstecken.
             */

            noButton.style.display =
                "none";


            /*
             * Erfolg anzeigen.
             */

            document
                .getElementById("success")
                .style.display = "flex";


            /*
             * Herzen starten.
             */

            createHearts();

        }



        /* =========================================
           HERZEN
        ========================================= */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(() => {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerText =

                        heartTypes[
                            Math.floor(
                                Math.random()
                                *
                                heartTypes.length
                            )
                        ];



                    heart.style.left =

                        Math.random()
                        * 100
                        + "vw";



                    heart.style.fontSize =

                        (
                            18 +
                            Math.random() * 25
                        )
                        + "px";



                    heart.style.animationDuration =

                        (
                            3 +
                            Math.random() * 3
                        )
                        + "s";



                    document.body.appendChild(
                        heart
                    );



                    setTimeout(() => {

                        heart.remove();

                    }, 6500);


                }, i * 80);

            }

        }



        /* =========================================
           WENN FENSTERGRÖSSE GEÄNDERT WIRD
        ========================================= */

        window.addEventListener(
            "resize",
            () => {


                /*
                 * Nur bewegen, wenn NEIN bereits
                 * vom normalen Layout getrennt wurde.
                 *
                 * Beim ersten Seitenaufruf passiert
                 * hier nichts.
                 */

                if (
                    noButton.style.position ===
                    "fixed"
                ) {

                    const position =
                        findSafePosition();


                    if (
                        position !== null
                    ) {

                        noButton.style.left =
                            `${position.x}px`;


                        noButton.style.top =
                            `${position.y}px`;

                    }

                }

            }
        );

    </script>

</body>

</html>
