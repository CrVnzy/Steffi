<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>

    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.28),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }


        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }

        .glow {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }

        .glow-1 {
            width: 320px;
            height: 320px;

            background: #ff2f68;

            top: -120px;
            left: -100px;
        }

        .glow-2 {
            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }


        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {
            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            min-height: 540px;

            padding: 60px 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 35px;

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255, 255, 255, 0.02);

            animation:
                cardAppear 1s ease forwards;
        }


        /* =====================================================
           HERZ
        ===================================================== */

        .heart {
            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }


        /* =====================================================
           TEXT
        ===================================================== */

        .small-text {
            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        h1 {
            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .question-text {
            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 18px;

            line-height: 1.7;
        }


        /* =====================================================
           BUTTON-BEREICH

           Beim ersten Laden:
           
           JA  +  NEIN

           nebeneinander.
        ===================================================== */

        .button-area {
            width: 100%;

            min-height: 110px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 24px;
        }


        /* =====================================================
           BUTTON GRUNDSTYLE
        ===================================================== */

        button {
            border: none;
            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 999px;

            padding:
                17px 35px;

            cursor: pointer;

            user-select: none;
        }


        /* =====================================================
           JA BUTTON
        ===================================================== */

        #yesButton {
            position: relative;

            z-index: 10;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );

            box-shadow:
                0 10px 30px
                rgba(255, 47, 104, 0.35);

            /*
             * NUR die Größe wird verändert.
             * Die Position bleibt durch Flexbox stabil.
             */
            transform:
                scale(1);

            transform-origin:
                center center;

            transition:
                transform 0.35s ease,
                box-shadow 0.3s ease;
        }

        #yesButton:hover {
            box-shadow:
                0 15px 40px
                rgba(255, 47, 104, 0.55);
        }


        /* =====================================================
           NEIN BUTTON
           
           Anfang:
           relative = neben JA

           Nach erstem Klick:
           fixed = kompletter Bildschirm
        ===================================================== */

        #noButton {
            position: relative;

            z-index: 20;

            color: white;

            background:
                rgba(255, 255, 255, 0.10);

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            /*
             * Wichtig:
             * left/top werden NICHT per CSS animiert.
             * JavaScript übernimmt die Bewegung.
             */

            transition:
                background 0.2s ease;
        }

        #noButton:hover {
            background:
                rgba(255, 255, 255, 0.16);
        }


        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {
            position: absolute;

            bottom: 20px;

            color:
                rgba(255, 255, 255, 0.35);

            font-size: 13px;
        }


        /* =====================================================
           ERFOLGSSEITE
        ===================================================== */

        .success {
            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 47, 104, 0.25),
                    rgba(0, 0, 0, 0.96)
                );
        }

        .success-content {
            padding: 30px;

            animation:
                successAppear 1s ease forwards;
        }

        .success-heart {
            font-size: 110px;

            margin-bottom: 25px;

            animation:
                heartbeat 1s infinite;
        }

        .success h2 {
            font-size:
                clamp(45px, 9vw, 90px);

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success p {
            font-size: 21px;

            color:
                rgba(255, 255, 255, 0.8);

            line-height: 1.7;
        }


        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {
            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;

            font-size: 25px;

            animation:
                floatHeart 5s linear forwards;
        }


        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes successAppear {

            from {
                opacity: 0;

                transform:
                    scale(0.8);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {
                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;
            }

            .heart {
                font-size: 60px;
            }

            .question-text {
                font-size: 16px;

                margin-bottom: 25px;
            }

            .button-area {
                gap: 14px;
            }

            button {
                font-size: 16px;

                padding:
                    15px 25px;
            }

            .hint {
                bottom: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >

        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">
            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭
        </p>


        <!-- =================================================
             BEIDE BUTTONS

             Beim Start nebeneinander.
        ================================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >
                Nein 🙈
            </button>

        </div>


        <div class="hint">
            Eine Antwort macht mich glücklich... 🥰
        </div>

    </div>



    <!-- =====================================================
         ERFOLG
    ===================================================== -->

    <div
        class="success"
        id="success"
    >

        <div class="success-content">

            <div class="success-heart">
                ❤️
            </div>

            <h2>
                Jaaaa! 🥰
            </h2>

            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>

        </div>

    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;

        let hasStartedFlying = false;

        let isFlying = false;


        /*
         * JA wächst pro NEIN-Klick
         * um 10 %.
         */

        const growthFactor = 1.10;


        /*
         * Maximale Größe.
         */

        const maxYesScale = 2.5;


        /*
         * Sicherheitsabstand zwischen
         * JA und NEIN.
         */

        const safetyGap = 50;


        /*
         * Abstand vom Bildschirmrand.
         */

        const screenPadding = 20;


        /*
         * Dauer eines Fluges in Millisekunden.
         */

        const flightDuration = 900;



        /* =====================================================
           NEIN-TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich lauf weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           PRÜFEN, OB EIN PUNKT INNERHALB
           EINES RECHTECKS LIEGT
        ===================================================== */

        function pointInsideRect(
            point,
            rect
        ) {

            return (

                point.x >= rect.left &&
                point.x <= rect.right &&
                point.y >= rect.top &&
                point.y <= rect.bottom

            );

        }



        /* =====================================================
           PRÜFEN, OB EINE LINIE EIN RECHTECK SCHNEIDET

           Wir prüfen die direkte Flugbahn
           des NEIN Buttons.
        ===================================================== */

        function lineIntersectsRect(
            start,
            end,
            rect
        ) {

            const dx =
                end.x - start.x;

            const dy =
                end.y - start.y;


            let tMin = 0;

            let tMax = 1;



            /*
             * X-Achse
             */

            if (dx === 0) {

                if (
                    start.x < rect.left ||
                    start.x > rect.right
                ) {

                    return false;

                }

            }
            else {

                let tx1 =
                    (rect.left - start.x)
                    / dx;

                let tx2 =
                    (rect.right - start.x)
                    / dx;


                if (tx1 > tx2) {

                    const temp = tx1;

                    tx1 = tx2;

                    tx2 = temp;

                }


                tMin =
                    Math.max(
                        tMin,
                        tx1
                    );

                tMax =
                    Math.min(
                        tMax,
                        tx2
                    );


                if (
                    tMin > tMax
                ) {

                    return false;

                }

            }



            /*
             * Y-Achse
             */

            if (dy === 0) {

                if (
                    start.y < rect.top ||
                    start.y > rect.bottom
                ) {

                    return false;

                }

            }
            else {

                let ty1 =
                    (rect.top - start.y)
                    / dy;

                let ty2 =
                    (rect.bottom - start.y)
                    / dy;


                if (ty1 > ty2) {

                    const temp = ty1;

                    ty1 = ty2;

                    ty2 = temp;

                }


                tMin =
                    Math.max(
                        tMin,
                        ty1
                    );

                tMax =
                    Math.min(
                        tMax,
                        ty2
                    );


                if (
                    tMin > tMax
                ) {

                    return false;

                }

            }


            return true;

        }



        /* =====================================================
           SICHERES ZIEL SUCHEN
        ===================================================== */

        function findSafeTarget() {


            /*
             * Aktuelle sichtbare Größe
             * und Position des JA Buttons.
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Größe des NEIN Buttons.
             */

            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            /*
             * Der JA Button wird um genau
             * so viel erweitert, dass nicht nur
             * sein Mittelpunkt, sondern der
             * gesamte NEIN Button berücksichtigt wird.
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safetyGap,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safetyGap,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safetyGap,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safetyGap

            };



            /*
             * Aktueller Mittelpunkt von NEIN.
             */

            const currentRect =
                noButton.getBoundingClientRect();


            const start = {

                x:
                    currentRect.left
                    +
                    currentRect.width / 2,

                y:
                    currentRect.top
                    +
                    currentRect.height / 2

            };



            /*
             * Maximal mögliche Position.
             */

            const minX =
                screenPadding
                +
                noWidth / 2;


            const maxX =
                window.innerWidth
                -
                screenPadding
                -
                noWidth / 2;


            const minY =
                screenPadding
                +
                noHeight / 2;


            const maxY =
                window.innerHeight
                -
                screenPadding
                -
                noHeight / 2;



            /*
             * Wir suchen sehr viele
             * zufällige Ziele.
             */

            for (
                let attempt = 0;
                attempt < 5000;
                attempt++
            ) {


                const target = {

                    x:
                        minX
                        +
                        Math.random()
                        *
                        Math.max(
                            1,
                            maxX - minX
                        ),

                    y:
                        minY
                        +
                        Math.random()
                        *
                        Math.max(
                            1,
                            maxY - minY
                        )

                };



                /*
                 * Ist das Ziel selbst sicher?
                 */

                const targetSafe =
                    !pointInsideRect(
                        target,
                        obstacle
                    );


                if (!targetSafe) {

                    continue;

                }



                /*
                 * Ist die direkte Flugbahn
                 * ebenfalls sicher?
                 */

                const pathSafe =
                    !lineIntersectsRect(
                        start,
                        target,
                        obstacle
                    );


                if (
                    pathSafe
                ) {

                    return {
                        start,
                        target
                    };

                }

            }



            /*
             * FALLBACK:

             * Wir probieren feste Stellen
             * an den Bildschirmrändern.
             */

            const fallbackTargets = [

                {
                    x: minX,
                    y: minY
                },

                {
                    x: maxX,
                    y: minY
                },

                {
                    x: minX,
                    y: maxY
                },

                {
                    x: maxX,
                    y: maxY
                },

                {
                    x: window.innerWidth / 2,
                    y: minY
                },

                {
                    x: window.innerWidth / 2,
                    y: maxY
                },

                {
                    x: minX,
                    y: window.innerHeight / 2
                },

                {
                    x: maxX,
                    y: window.innerHeight / 2
                }

            ];



            for (
                const target
                of fallbackTargets
            ) {


                if (
                    pointInsideRect(
                        target,
                        obstacle
                    )
                ) {

                    continue;

                }


                if (
                    lineIntersectsRect(
                        start,
                        target,
                        obstacle
                    )
                ) {

                    continue;

                }


                return {
                    start,
                    target
                };

            }



            /*
             * Sollte eigentlich nicht vorkommen.

             * Dann bleibt NEIN an seiner
             * aktuellen Position.
             */

            return null;

        }



        /* =====================================================
           SMOOTH ZUM ZIEL FLIEGEN
        ===================================================== */

        function flyNoButton(
            start,
            target
        ) {


            /*
             * Abstand berechnen.

             * Dadurch können wir die
             * Fluggeschwindigkeit etwas
             * natürlicher machen.
             */

            const distance =
                Math.hypot(
                    target.x - start.x,
                    target.y - start.y
                );


            /*
             * Längere Strecke = etwas
             * längere Animation.
             */

            const duration =

                Math.min(
                    1400,
                    Math.max(
                        flightDuration,
                        distance * 1.2
                    )
                );



            /*
             * Startposition exakt festlegen.
             */

            noButton.style.left =
                (
                    start.x
                    -
                    noButton.offsetWidth / 2
                )
                +
                "px";


            noButton.style.top =
                (
                    start.y
                    -
                    noButton.offsetHeight / 2
                )
                +
                "px";



            /*
             * Browser zwingend dazu bringen,
             * die Startposition zuerst zu übernehmen.
             */

            void noButton.offsetWidth;



            /*
             * Jetzt erst die eigentliche
             * Smooth-Animation aktivieren.
             */

            noButton.style.transition =
                `
                left ${duration}ms cubic-bezier(
                    0.22,
                    0.61,
                    0.36,
                    1
                ),
                top ${duration}ms cubic-bezier(
                    0.22,
                    0.61,
                    0.36,
                    1
                )
                `;



            /*
             * ZIEL setzen.

             * Jetzt fliegt NEIN direkt los.
             */

            requestAnimationFrame(() => {

                noButton.style.left =
                    (
                        target.x
                        -
                        noButton.offsetWidth / 2
                    )
                    +
                    "px";


                noButton.style.top =
                    (
                        target.y
                        -
                        noButton.offsetHeight / 2
                    )
                    +
                    "px";

            });



            /*
             * Nach dem Flug Transition entfernen.

             * Für den nächsten Flug wird sie
             * neu gesetzt.
             */

            setTimeout(
                () => {

                    noButton.style.transition =
                        "background 0.2s ease";


                    noButton.style.transform =
                        "none";


                    isFlying = false;


                    noButton.style.pointerEvents =
                        "auto";

                },

                duration + 50
            );

        }



        /* =====================================================
           NEIN GEKLICKT
        ===================================================== */

        function sayNo() {


            /*
             * Während des Fluges keine
             * weiteren Klicks akzeptieren.
             */

            if (
                isFlying
            ) {

                return;

            }


            isFlying = true;


            noButton.style.pointerEvents =
                "none";


            noClicks++;



            /* =================================================
               1. JA WIRD SOFORT GRÖSSER
            ================================================= */

            yesScale *= growthFactor;


            if (
                yesScale > maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }


            yesButton.style.transform =
                `scale(${yesScale})`;



            /* =================================================
               2. TEXT ÄNDERN
            ================================================= */

            const textIndex =
                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /* =================================================
               3. NACH DER JA-VERGRÖSSERUNG
                  FLUGWEG BERECHNEN
            ================================================= */

            requestAnimationFrame(() => {


                /*
                 * Beim ersten Klick müssen wir
                 * NEIN vom normalen Flex-Layout
                 * in fixed umwandeln.
                 */

                if (
                    !hasStartedFlying
                ) {


                    /*
                     * Aktuelle Position merken.
                     */

                    const rect =
                        noButton.getBoundingClientRect();


                    /*
                     * Fixed aktivieren.
                     */

                    noButton.style.position =
                        "fixed";


                    noButton.style.margin =
                        "0";


                    /*
                     * Startposition beibehalten.
                     */

                    noButton.style.left =
                        rect.left + "px";


                    noButton.style.top =
                        rect.top + "px";


                    hasStartedFlying = true;


                    /*
                     * Layout aktualisieren.
                     */

                    void noButton.offsetWidth;

                }



                /*
                 * Einen Frame warten,
                 * damit JA seine neue Größe
                 * vollständig übernommen hat.
                 */

                requestAnimationFrame(() => {


                    const path =
                        findSafeTarget();


                    /*
                     * Wenn kein sicherer Weg
                     * gefunden wurde, bleiben wir
                     * einfach an der Stelle.
                     */

                    if (
                        path === null
                    ) {

                        isFlying = false;

                        noButton.style.pointerEvents =
                            "auto";

                        return;

                    }


                    /*
                     * Jetzt wirklich fliegen.
                     */

                    flyNoButton(
                        path.start,
                        path.target
                    );

                });

            });

        }



        /* =====================================================
           JA GEKLICKT
        ===================================================== */

        function sayYes() {


            document
                .getElementById(
                    "mainCard"
                )
                .style.display =
                "none";


            noButton.style.display =
                "none";


            document
                .getElementById(
                    "success"
                )
                .style.display =
                "flex";


            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(
                    () => {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.className =
                            "floating-heart";


                        heart.innerText =
                            hearts[
                                Math.floor(
                                    Math.random()
                                    *
                                    hearts.length
                                )
                            ];


                        heart.style.left =
                            Math.random()
                            *
                            100
                            +
                            "vw";


                        heart.style.fontSize =
                            (
                                18
                                +
                                Math.random()
                                * 25
                            )
                            +
                            "px";


                        heart.style.animationDuration =
                            (
                                3
                                +
                                Math.random()
                                * 3
                            )
                            +
                            "s";


                        document.body.appendChild(
                            heart
                        );


                        setTimeout(
                            () => {

                                heart.remove();

                            },

                            6500
                        );


                    },

                    i * 70
                );

            }

        }

    </script>

</body>

</html>
