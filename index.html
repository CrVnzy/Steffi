<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;
            align-items: center;


            font-family:
                Arial,
                Helvetica,
                sans-serif;


            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 55, 115, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(160, 60, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1b0814,
                    #080409
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow.one {

            width: 320px;
            height: 320px;

            background: #ff2f68;

            left: -110px;
            top: -120px;
        }


        .glow.two {

            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }



        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 5;


            width: min(
                700px,
                92vw
            );


            min-height: 540px;


            padding:
                55px 35px;


            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;


            text-align: center;


            background:
                rgba(255,255,255,0.07);


            border:
                1px solid
                rgba(255,255,255,0.13);


            border-radius: 32px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0,0,0,0.45),

                inset 0 0 30px
                rgba(255,255,255,0.02);


            animation:
                appear 0.8s ease;
        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 65px;

            margin-bottom: 15px;


            animation:
                heartbeat 1.8s ease-in-out infinite;
        }



        /* =====================================================
           KLEINER TEXT
        ===================================================== */

        .eyebrow {

            margin-bottom: 12px;


            color: #ff9db8;


            font-size: 13px;


            font-weight: bold;


            letter-spacing: 3px;


            text-transform: uppercase;
        }



        /* =====================================================
           TITEL
        ===================================================== */

        h1 {

            margin-bottom: 20px;


            font-size:
                clamp(
                    42px,
                    8vw,
                    75px
                );


            line-height: 1;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb4ca
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }



        /* =====================================================
           BESCHREIBUNG
        ===================================================== */

        .description {

            max-width: 520px;


            margin-bottom: 25px;


            color:
                rgba(
                    255,
                    255,
                    255,
                    0.75
                );


            font-size: 18px;


            line-height: 1.7;
        }



        /* =====================================================
           BUTTON-STAGE

           DAS IST DER GESAMTE SICHERHEITSBEREICH.

           NEIN DARF NUR INNERHALB DIESES ELEMENTS
           TELEPORTIEREN.
        ===================================================== */

        .button-stage {

            position: relative;


            width: min(
                560px,
                100%
            );


            /*
             * Auf Desktop etwas größer.
             */

            height: 220px;


            margin-top: 5px;


            border-radius: 24px;


            /*
             * Unsichtbare Begrenzung.
             */

            overflow: hidden;
        }



        /* =====================================================
           BUTTON BASIS
        ===================================================== */

        button {

            border: none;

            outline: none;


            font-family: inherit;


            font-size: 18px;


            font-weight: bold;


            border-radius: 999px;


            padding:
                16px 32px;


            cursor: pointer;


            user-select: none;


            white-space: nowrap;


            -webkit-tap-highlight-color:
                transparent;
        }



        /* =====================================================
           JA BUTTON

           Immer ungefähr in der Mitte.
        ===================================================== */

        #yesButton {

            position: absolute;


            left: 38%;


            top: 50%;


            z-index: 10;


            transform:

                translate(
                    -50%,
                    -50%
                )

                scale(1);


            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(
                    255,
                    47,
                    104,
                    0.35
                );


            transition:

                transform
                0.35s ease,

                box-shadow
                0.25s ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(
                    255,
                    47,
                    104,
                    0.55
                );
        }



        /* =====================================================
           NEIN BUTTON

           IMPORTANT:
           position: absolute
           innerhalb der Stage.

           Kein fixed.
           Keine Bildschirmkoordinaten.
        ===================================================== */

        #noButton {

            position: absolute;


            left: 70%;


            top: 50%;


            z-index: 20;


            transform:

                translate(
                    -50%,
                    -50%
                );


            color: white;


            background:

                rgba(
                    255,
                    255,
                    255,
                    0.10
                );


            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );


            transition:

                background
                0.2s ease;
        }


        #noButton:hover {

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.16
                );
        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            margin-top: 5px;


            color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );


            font-size: 13px;
        }



        /* =====================================================
           ERFOLGSSEITE
        ===================================================== */

        .success {

            position: fixed;


            inset: 0;


            z-index: 100;


            display: none;


            justify-content: center;


            align-items: center;


            text-align: center;


            padding: 25px;


            background:

                radial-gradient(
                    circle,
                    rgba(
                        255,
                        47,
                        104,
                        0.28
                    ),
                    rgba(
                        0,
                        0,
                        0,
                        0.96
                    )
                );
        }


        .success-content {

            animation:
                successAppear
                0.9s ease;
        }


        .success-heart {

            font-size: 100px;

            margin-bottom: 20px;


            animation:
                heartbeat
                1s infinite;
        }


        .success h2 {

            margin-bottom: 20px;


            font-size:
                clamp(
                    48px,
                    9vw,
                    90px
                );


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc5d6
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );


            font-size: 20px;


            line-height: 1.7;
        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;


            left: 50%;


            bottom: -40px;


            z-index: 500;


            pointer-events: none;


            font-size: 25px;


            animation:

                floatHeart
                5s linear forwards;
        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);
            }


            50% {

                transform:
                    scale(1.15);
            }
        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-25px);
            }
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.8);
            }


            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }


            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }



        /* =====================================================
           MOBILE

           Der Flugbereich wird höher,
           damit genug Platz vorhanden ist.
        ===================================================== */

        @media (
            max-width: 600px
        ) {

            .card {

                width: 92vw;

                min-height: 540px;

                padding:
                    40px 18px;
            }


            .heart {

                font-size: 55px;

                margin-bottom: 12px;
            }


            .description {

                font-size: 16px;

                max-width: 90%;

                margin-bottom: 15px;
            }


            .button-stage {

                width: 100%;

                height: 250px;
            }


            #yesButton {

                left: 38%;
            }


            #noButton {

                left: 70%;
            }


            button {

                font-size: 16px;

                padding:
                    14px 23px;
            }


            .hint {

                font-size: 12px;
            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <main
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="eyebrow">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="description">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             SICHERHEITSBEREICH
        ================================================== -->

        <div
            class="button-stage"
            id="buttonStage"
        >


            <!-- JA -->

            <button
                id="yesButton"
                type="button"
            >
                Ja ❤️
            </button>



            <!-- NEIN -->

            <button
                id="noButton"
                type="button"
            >
                Nein 🙈
            </button>


        </div>



        <div class="hint">
            Eine Antwort macht mich glücklich... 🥰
        </div>


    </main>



    <!-- =====================================================
         ERFOLGSSEITE
    ===================================================== -->

    <section
        class="success"
        id="success"
    >


        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>

                Ich wusste doch,
                dass du mich magst. ❤️

            </p>


        </div>


    </section>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const stage =
            document.getElementById(
                "buttonStage"
            );


        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );


        const mainCard =
            document.getElementById(
                "mainCard"
            );


        const success =
            document.getElementById(
                "success"
            );



        /* =====================================================
           VARIABLEN
        ===================================================== */

        let yesScale = 1;


        let noClicks = 0;


        /*
         * JA wächst bei jedem NEIN
         * um 12 %.
         */

        const growthFactor = 1.12;


        /*
         * Maximal 220 %.
         *
         * Damit bleibt auf Handys
         * genug Platz.
         */

        const maxYesScale = 2.2;


        /*
         * Mindestabstand zwischen
         * JA und NEIN.
         */

        const safetyGap = 25;


        /*
         * Abstand zum Rand der
         * button-stage.
         */

        const stagePadding = 10;


        /*
         * Texte für NEIN.
         */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich gebe nicht auf 😂",

            "Du machst es mir schwer 😏"

        ];



        /* =====================================================
           RECHTECK ÜBERLAPPT?
        ===================================================== */

        function overlaps(
            a,
            b,
            gap = 0
        ) {

            return (

                a.left
                <
                b.right + gap

                &&

                a.right
                >
                b.left - gap

                &&

                a.top
                <
                b.bottom + gap

                &&

                a.bottom
                >
                b.top - gap

            );

        }



        /* =====================================================
           IST NEIN INNERHALB DER STAGE?
        ===================================================== */

        function isInsideStage(
            rect
        ) {

            const stageWidth =
                stage.clientWidth;


            const stageHeight =
                stage.clientHeight;


            return (

                rect.left
                >=
                stagePadding

                &&

                rect.top
                >=
                stagePadding

                &&

                rect.right
                <=
                stageWidth
                -
                stagePadding

                &&

                rect.bottom
                <=
                stageHeight
                -
                stagePadding

            );

        }



        /* =====================================================
           JA-RECHTECK IN STAGE KOORDINATEN
        ===================================================== */

        function getYesRect() {

            const stageRect =
                stage.getBoundingClientRect();


            const yesRect =
                yesButton.getBoundingClientRect();


            return {

                left:
                    yesRect.left
                    -
                    stageRect.left,

                top:
                    yesRect.top
                    -
                    stageRect.top,

                right:
                    yesRect.right
                    -
                    stageRect.left,

                bottom:
                    yesRect.bottom
                    -
                    stageRect.top

            };

        }



        /* =====================================================
           NEIN-RECHTECK FÜR EINE POSITION
        ===================================================== */

        function getNoRect(
            centerX,
            centerY
        ) {

            const width =
                noButton.offsetWidth;


            const height =
                noButton.offsetHeight;


            return {

                left:
                    centerX
                    -
                    width / 2,

                top:
                    centerY
                    -
                    height / 2,

                right:
                    centerX
                    +
                    width / 2,

                bottom:
                    centerY
                    +
                    height / 2

            };

        }



        /* =====================================================
           SICHERE POSITION SUCHEN
        ===================================================== */

        function findSafePosition() {


            const yesRect =
                getYesRect();


            const noWidth =
                noButton.offsetWidth;


            const noHeight =
                noButton.offsetHeight;


            /*
             * Erlaubte Mittelpunkt-Positionen
             * für NEIN.
             */

            const minX =
                stagePadding
                +
                noWidth / 2;


            const maxX =
                stage.clientWidth
                -
                stagePadding
                -
                noWidth / 2;


            const minY =
                stagePadding
                +
                noHeight / 2;


            const maxY =
                stage.clientHeight
                -
                stagePadding
                -
                noHeight / 2;



            /*
             * Falls aus irgendeinem Grund
             * kein sinnvoller Bereich existiert,
             * nichts verändern.
             */

            if (
                maxX <= minX
                ||
                maxY <= minY
            ) {

                return null;

            }



            /*
             * Bis zu 10.000 Positionen testen.

             * Dadurch ist die Chance extrem hoch,
             * dass eine sichere Position gefunden wird.
             */

            for (
                let i = 0;
                i < 10000;
                i++
            ) {


                const x =

                    minX
                    +
                    Math.random()
                    *
                    (
                        maxX - minX
                    );


                const y =

                    minY
                    +
                    Math.random()
                    *
                    (
                        maxY - minY
                    );



                const candidate =
                    getNoRect(
                        x,
                        y
                    );



                /*
                 * Muss vollständig
                 * innerhalb der Stage sein.
                 */

                if (
                    !isInsideStage(
                        candidate
                    )
                ) {

                    continue;

                }



                /*
                 * Darf JA nicht berühren.
                 */

                if (
                    overlaps(
                        candidate,
                        yesRect,
                        safetyGap
                    )
                ) {

                    continue;

                }



                /*
                 * Zusätzlich müssen wir
                 * vermeiden, dass NEIN
                 * exakt an der alten Position landet.
                 */

                return {
                    x,
                    y
                };

            }



            /*
             * Feste Positionen als Fallback.

             * Damit der Button nicht verschwindet,
             * wenn JA einmal sehr groß ist.
             */

            const fallbackPositions = [

                {
                    x: minX,
                    y: minY
                },

                {
                    x: maxX,
                    y: minY
                },

                {
                    x: minX,
                    y: maxY
                },

                {
                    x: maxX,
                    y: maxY
                },

                {
                    x:
                        minX,

                    y:
                        (
                            minY
                            +
                            maxY
                        )
                        /
                        2
                },

                {
                    x:
                        maxX,

                    y:
                        (
                            minY
                            +
                            maxY
                        )
                        /
                        2
                }

            ];



            for (
                const position
                of fallbackPositions
            ) {


                const candidate =
                    getNoRect(
                        position.x,
                        position.y
                    );


                if (

                    isInsideStage(
                        candidate
                    )

                    &&

                    !overlaps(
                        candidate,
                        yesRect,
                        safetyGap
                    )

                ) {

                    return position;

                }

            }



            /*
             * Wirklich keine Position gefunden.

             * Dann bleibt NEIN einfach
             * an seiner aktuellen Position.
             */

            return null;

        }



        /* =====================================================
           NEIN BUTTON TELEPORTIEREN
        ===================================================== */

        function teleportNoButton() {


            const position =
                findSafePosition();


            /*
             * Falls keine Position gefunden
             * wurde, nichts verändern.
             */

            if (
                position === null
            ) {

                return;

            }



            /*
             * WICHTIG:

             * Kein transition für left/top.

             * Dadurch gibt es wirklich
             * KEINE Bewegung.

             * Der Button erscheint direkt
             * an der neuen Position.
             */

            noButton.style.left =
                `${position.x}px`;


            noButton.style.top =
                `${position.y}px`;

        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        function sayNo() {


            noClicks++;



            /*
             * 1. JA VERGRÖSSERN
             */

            yesScale *=
                growthFactor;


            if (
                yesScale >
                maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }



            /*
             * JA Größe aktualisieren.
             */

            yesButton.style.transform =

                `
                translate(-50%, -50%)
                scale(${yesScale})
                `;



            /*
             * 2. NEIN TEXT ÄNDERN
             */

            const textIndex =

                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * 3. GANZ WICHTIG:

             * Erst nachdem JA größer geworden ist,
             * neue sichere Position berechnen.
             */

            requestAnimationFrame(() => {


                teleportNoButton();

            });

        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        function sayYes() {


            /*
             * Hauptseite ausblenden.
             */

            mainCard.style.display =
                "none";


            /*
             * Erfolgsseite anzeigen.
             */

            success.style.display =
                "flex";


            /*
             * Herzen.
             */

            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(() => {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerText =

                        heartTypes[
                            Math.floor(
                                Math.random()
                                *
                                heartTypes.length
                            )
                        ];


                    heart.style.left =

                        (
                            Math.random()
                            *
                            100
                        )
                        +
                        "vw";


                    heart.style.fontSize =

                        (
                            18
                            +
                            Math.random()
                            *
                            25
                        )
                        +
                        "px";


                    heart.style.animationDuration =

                        (
                            3
                            +
                            Math.random()
                            *
                            3
                        )
                        +
                        "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 6500);


                }, i * 70);

            }

        }



        /* =====================================================
           BUTTONS BEIM LADEN

           Die Startpositionen werden bereits
           vom CSS vorgegeben:

           JA = 38%
           NEIN = 70%

           Dadurch liegen sie beim ersten Laden
           nebeneinander.

        ===================================================== */

        window.addEventListener(
            "load",
            () => {

                /*
                 * Absichtlich NICHTS verschieben.
                 *
                 * Das ist wichtig für den
                 * sauberen Startzustand.
                 */

            }
        );



        /* =====================================================
           RESIZE

           Wenn z.B. das Handy gedreht wird,
           prüfen wir nur, ob NEIN noch innerhalb
           der Stage liegt.

           Wir bewegen ihn NICHT automatisch,
           solange die Seite gerade erst geladen wurde.
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {


                /*
                 * Erst prüfen:
                 * aktuelle Position.
                 */

                const rect =
                    noButton.getBoundingClientRect();


                const stageRect =
                    stage.getBoundingClientRect();


                const stagePosition = {

                    left:
                        rect.left
                        -
                        stageRect.left,

                    top:
                        rect.top
                        -
                        stageRect.top,

                    right:
                        rect.right
                        -
                        stageRect.left,

                    bottom:
                        rect.bottom
                        -
                        stageRect.top

                };


                /*
                 * Nur wenn der Button
                 * außerhalb geraten ist,
                 * wird eine sichere Position
                 * gesucht.
                 */

                if (
                    !isInsideStage(
                        stagePosition
                    )
                ) {
