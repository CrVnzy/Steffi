<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }


        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow-1 {

            width: 320px;
            height: 320px;

            left: -100px;
            top: -120px;

            background: #ff2f68;
        }


        .glow-2 {

            width: 320px;
            height: 320px;

            right: -100px;
            bottom: -100px;

            background: #9c27ff;

            animation-delay: 2s;
        }


        /* =====================================================
           KARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            min-height: 540px;

            padding:
                60px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255, 255, 255, 0.07);


            border:
                1px solid
                rgba(255, 255, 255, 0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255, 255, 255, 0.02);


            animation:
                cardAppear 1s ease;
        }


        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }


        /* =====================================================
           TEXT
        ===================================================== */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        h1 {

            margin-bottom: 25px;

            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .question-text {

            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 18px;

            line-height: 1.7;
        }


        /* =====================================================
           BUTTON-BEREICH
           
           WICHTIG:
           Beide Buttons sind beim START ganz normale
           Flex-Elemente.
        ===================================================== */

        .button-area {

            width: 100%;

            min-height: 100px;


            display: flex;

            justify-content: center;

            align-items: center;


            gap: 24px;
        }


        /* =====================================================
           BUTTONEN
        ===================================================== */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 999px;

            padding:
                17px 35px;

            cursor: pointer;

            user-select: none;
        }


        /* =====================================================
           JA BUTTON
        ===================================================== */

        #yesButton {

            position: relative;

            z-index: 10;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255, 47, 104, 0.35);


            transform: scale(1);

            transform-origin: center center;


            transition:
                transform 350ms ease,
                box-shadow 250ms ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255, 47, 104, 0.55);
        }


        /* =====================================================
           NEIN BUTTON

           Beim Start:
           position: relative

           Nach erstem Klick:
           position: fixed
        ===================================================== */

        #noButton {

            position: relative;

            z-index: 100;


            color: white;


            background:
                rgba(255,255,255,0.10);


            border:
                1px solid
                rgba(255,255,255,0.18);


            transition:
                background 200ms ease;
        }


        #noButton:hover {

            background:
                rgba(255,255,255,0.16);
        }


        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            position: absolute;

            bottom: 20px;

            color:
                rgba(255,255,255,0.35);

            font-size: 13px;
        }


        /* =====================================================
           ERFOLG
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            justify-content: center;

            align-items: center;

            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255,47,104,0.25),
                    rgba(0,0,0,0.96)
                );
        }


        .success-content {

            padding: 30px;

            animation:
                successAppear 1s ease;
        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;

            animation:
                heartbeat 1s infinite;
        }


        .success h2 {

            margin-bottom: 20px;

            font-size:
                clamp(45px,9vw,90px);


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            color:
                rgba(255,255,255,0.8);

            font-size: 21px;

            line-height: 1.7;
        }


        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;

            font-size: 25px;

            animation:
                floatHeart 5s linear forwards;
        }


        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform: scale(0.8);
            }

            to {

                opacity: 1;

                transform: scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;
            }


            .heart {
                font-size: 60px;
            }


            .question-text {

                font-size: 16px;

                margin-bottom: 25px;
            }


            .button-area {

                gap: 14px;
            }


            button {

                font-size: 16px;

                padding:
                    15px 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>


        <!-- =================================================
             BEIDE BUTTONS

             Beim Start exakt gleiche Höhe.
        ================================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >


            <button
                id="yesButton"
                onclick="sayYes()"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >
                Nein 🙈
            </button>


        </div>


        <div class="hint">
            Eine Antwort macht mich glücklich... 🥰
        </div>


    </div>



    <!-- =====================================================
         ERFOLGSSEITE
    ===================================================== -->

    <div
        class="success"
        id="success"
    >


        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>


        </div>


    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;

        let flying = false;


        /*
         * JA wächst pro NEIN Klick um 12%.
         */

        const growth =
            1.12;


        /*
         * Maximale Größe.
         */

        const maxScale =
            2.7;


        /*
         * Sicherheitsabstand.
         */

        const safety =
            60;



        /* =====================================================
           TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich lauf weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           RECHTECK ERWEITERN
        ===================================================== */

        function expandRect(
            rect,
            amount
        ) {

            return {

                left:
                    rect.left - amount,

                top:
                    rect.top - amount,

                right:
                    rect.right + amount,

                bottom:
                    rect.bottom + amount

            };

        }



        /* =====================================================
           PUNKT IN RECHTECK?
        ===================================================== */

        function pointInside(
            point,
            rect
        ) {

            return (

                point.x >= rect.left &&

                point.x <= rect.right &&

                point.y >= rect.top &&

                point.y <= rect.bottom

            );

        }



        /* =====================================================
           LINIE SCHNEIDET RECHTECK?
        ===================================================== */

        function lineHitsRect(
            a,
            b,
            rect
        ) {


            /*
             * Vektor.
             */

            const dx =
                b.x - a.x;

            const dy =
                b.y - a.y;


            /*
             * Wenn Start oder Ziel
             * innerhalb des Rechtecks liegt.
             */

            if (
                pointInside(a, rect)
                ||
                pointInside(b, rect)
            ) {

                return true;

            }


            /*
             * Anzahl der Prüfpunkte.

             * Sehr hoch, damit wir auch bei
             * diagonalen Bewegungen sicher sind.
             */

            const steps = 200;


            for (
                let i = 0;
                i <= steps;
                i++
            ) {


                const t =
                    i / steps;


                const x =
                    a.x + dx * t;


                const y =
                    a.y + dy * t;


                if (
                    pointInside(
                        { x, y },
                        rect
                    )
                ) {

                    return true;

                }

            }


            return false;

        }



        /* =====================================================
           SICHERES ZIEL SUCHEN
        ===================================================== */

        function findTarget(
            start
        ) {


            /*
             * Aktuelle sichtbare Größe
             * des JA Buttons.
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Größe des NEIN Buttons.

             * Diese wird verwendet, um sicherzustellen,
             * dass nicht nur sein Mittelpunkt Abstand hält.
             */

            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            /*
             * JA wird künstlich vergrößert.

             * Das ist unser "verbotener Bereich".
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safety,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safety,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safety,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safety

            };



            /*
             * Mögliche Ziele auf dem Bildschirm.
             */

            const candidates = [

                /* oben */

                {
                    x:
                        window.innerWidth * 0.2
                        +
                        Math.random()
                        *
                        window.innerWidth * 0.6,

                    y:
                        40
                },


                /* unten */

                {
                    x:
                        window.innerWidth * 0.2
                        +
                        Math.random()
                        *
                        window.innerWidth * 0.6,

                    y:
                        window.innerHeight - 40
                },


                /* links */

                {
                    x:
                        40,

                    y:
                        window.innerHeight * 0.2
                        +
                        Math.random()
                        *
                        window.innerHeight * 0.6
                },


                /* rechts */

                {
                    x:
                        window.innerWidth - 40,

                    y:
                        window.innerHeight * 0.2
                        +
                        Math.random()
                        *
                        window.innerHeight * 0.6
                },


                /* oben links */

                {
                    x: 40,

                    y: 40
                },


                /* oben rechts */

                {
                    x:
                        window.innerWidth - 40,

                    y: 40
                },


                /* unten links */

                {
                    x: 40,

                    y:
                        window.innerHeight - 40
                },


                /* unten rechts */

                {
                    x:
                        window.innerWidth - 40,

                    y:
                        window.innerHeight - 40
                }

            ];



            /*
             * Zufällige Ziele zuerst
             * ausprobieren.
             */

            for (
                let i = 0;
                i < 2000;
                i++
            ) {


                const target = {

                    x:
                        noWidth / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerWidth
                            -
                            noWidth
                        ),

                    y:
                        noHeight / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerHeight
                            -
                            noHeight
                        )

                };


                /*
                 * Ziel selbst darf nicht
                 * im JA Bereich sein.
                 */

                if (
                    pointInside(
                        target,
                        obstacle
                    )
                ) {

                    continue;

                }


                /*
                 * Direkte Linie testen.
                 */

                if (
                    !lineHitsRect(
                        start,
                        target,
                        obstacle
                    )
                ) {

                    return {
                        start,
                        target
                    };

                }

            }



            /*
             * Falls keine direkte Route möglich ist,
             * Eckpunkte um JA benutzen.
             */

            const margin =
                safety + 20;


            const waypoints = [

                {
                    x:
                        obstacle.left - margin,

                    y:
                        obstacle.top - margin
                },

                {
                    x:
                        obstacle.right + margin,

                    y:
                        obstacle.top - margin
                },

                {
                    x:
                        obstacle.right + margin,

                    y:
                        obstacle.bottom + margin
                },

                {
                    x:
                        obstacle.left - margin,

                    y:
                        obstacle.bottom + margin
                }

            ];



            /*
             * Jede mögliche Route ausprobieren.
             */

            for (
                const waypoint of waypoints
            ) {


                const target = {

                    x:
                        Math.max(
                            noWidth / 2 + 10,

                            Math.min(
                                window.innerWidth
                                -
                                noWidth / 2
                                -
                                10,

                                waypoint.x
                            )
                        ),

                    y:
                        Math.max(
                            noHeight / 2 + 10,

                            Math.min(
                                window.innerHeight
                                -
                                noHeight / 2
                                -
                                10,

                                waypoint.y
                            )
                        )

                };


                if (
                    !lineHitsRect(
                        start,
                        target,
                        obstacle
                    )
                ) {

                    return {
                        start,
                        target
                    };

                }

            }



            /*
             * Absolute Notlösung:

             * Bildschirmrand oben links.
             */

            return {

                start,

                target: {

                    x:
                        noWidth / 2 + 10,

                    y:
                        noHeight / 2 + 10

                }

            };

        }



        /* =====================================================
           SMOOTH FLUG
        ===================================================== */

        function fly(
            start,
            target
        ) {


            /*
             * Entfernung.

             */

            const distance =

                Math.hypot(

                    target.x - start.x,

                    target.y - start.y

                );


            /*
             * Dauer.

             * Minimum 700ms.
             * Maximum 1400ms.
             */

            const duration =

                Math.max(
                    700,

                    Math.min(
                        1400,

                        distance * 1.3
                    )
                );


            const startTime =
                performance.now();



            function animationFrame(
                now
            ) {


                const elapsed =
                    now - startTime;


                let progress =
                    elapsed / duration;


                if (
                    progress > 1
                ) {

                    progress = 1;

                }



                /*
                 * Ease-Out.

                 * Start schnell,
                 * Ende sanft.
                 */

                const eased =

                    1 -
                    Math.pow(
                        1 - progress,
                        3
                    );



                /*
                 * Position interpolieren.
                 */

                const x =

                    start.x
                    +
                    (
                        target.x
                        -
                        start.x
                    )
                    *
                    eased;


                const y =

                    start.y
                    +
                    (
                        target.y
                        -
                        start.y
                    )
                    *
                    eased;



                /*
                 * Position setzen.

                 * JS statt CSS transition.
                 */

                noButton.style.left =

                    (
                        x
                        -
                        noButton.offsetWidth / 2
                    )
                    +
                    "px";


                noButton.style.top =

                    (
                        y
                        -
                        noButton.offsetHeight / 2
                    )
                    +
                    "px";



                /*
                 * Leichte Drehung.
                 */

                const rotation =

                    Math.sin(
                        progress
                        *
                        Math.PI
                        *
                        4
                    )
                    *
                    4;


                noButton.style.transform =

                    `rotate(${rotation}deg)`;



                /*
                 * Weiter?
                 */

                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animationFrame
                    );

                }

                else {

                    noButton.style.transform =
                        "none";

                    noButton.style.pointerEvents =
                        "auto";

                    flying = false;

                }

            }


            requestAnimationFrame(
                animationFrame
            );

        }



        /* =====================================================
           NEIN
        ===================================================== */

        function sayNo() {


            /*
             * Während des Fluges nicht
             * erneut klicken.
             */

            if (
                flying
            ) {

                return;

            }


            flying = true;


            noButton.style.pointerEvents =
                "none";


            noClicks++;



            /* =================================================
               JA SOFORT VERGRÖSSERN
            ================================================= */

            yesScale *= growth;


            if (
                yesScale > maxScale
            ) {

                yesScale =
                    maxScale;

            }


            yesButton.style.transform =
                `scale(${yesScale})`;



            /* =================================================
               TEXT ÄNDERN
            ================================================= */

            const textIndex =

                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * Browser erst die neue JA-Größe
             * berechnen lassen.
             */

            requestAnimationFrame(() => {


                /*
                 * NEIN ist aktuell noch
                 * ganz normal neben JA.

                 * Jetzt holen wir seine echte
                 * Bildschirmposition.
                 */

                const rect =
                    noButton.getBoundingClientRect();



                /*
                 * NEIN auf fixed umstellen.

                 * Exakte Position beibehalten.
                 */

                noButton.style.position =
                    "fixed";


                noButton.style.left =
                    rect.left + "px";


                noButton.style.top =
                    rect.top + "px";


                noButton.style.margin =
                    "0";


                noButton.style.transform =
                    "none";



                /*
                 * Browser rechnen lassen.
                 */

                requestAnimationFrame(() => {


                    /*
                     * Mittelpunkt des NEIN Buttons.
                     */

                    const fixedRect =
                        noButton.getBoundingClientRect();


                    const start = {

                        x:
                            fixedRect.left
                            +
                            fixedRect.width / 2,

                        y:
                            fixedRect.top
                            +
                            fixedRect.height / 2

                    };



                    /*
                     * Sicheren Flugweg suchen.
                     */

                    const route =
                        findTarget(start);


                    /*
                     * Fliegen!
                     */

                    fly(
                        route.start,
                        route.target
                    );

                });

            });

        }



        /* =====================================================
           JA
        ===================================================== */

        function sayYes() {


            document
                .getElementById(
                    "mainCard"
                )
                .style.display =
                "none";


            noButton.style.display =
                "none";


            document
                .getElementById(
                    "success"
                )
                .style.display =
                "flex";


            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(() => {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerText =
                        heartTypes[
                            Math.floor(
                                Math.random()
                                *
                                heartTypes.length
                            )
                        ];


                    heart.style.left =
                        Math.random()
                        * 100
                        + "vw";


                    heart.style.fontSize =
                        (
                            18
                            +
                            Math.random()
                            * 25
                        )
                        +
                        "px";


                    heart.style.animationDuration =
                        (
                            3
                            +
                            Math.random()
                            * 3
                        )
                        +
                        "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 6500);


                }, i * 70);

            }

        }

    </script>

</body>

</html>
