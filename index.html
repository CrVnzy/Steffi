<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eine kleine Frage ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.28),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }


        /* =========================
           HINTERGRUND
        ========================= */

        .background-glow {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }

        .glow {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.35;

            animation: floating 8s ease-in-out infinite;
        }

        .glow-1 {
            width: 320px;
            height: 320px;

            background: #ff2f68;

            top: -120px;
            left: -100px;
        }

        .glow-2 {
            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }


        /* =========================
           HAUPTKARTE
        ========================= */

        .card {
            position: relative;

            z-index: 2;

            width: min(700px, 90%);
            min-height: 540px;

            padding: 60px 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.13);

            border-radius: 35px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.45),
                inset 0 0 30px rgba(255, 255, 255, 0.02);

            animation:
                cardAppear 1s ease forwards;
        }


        /* =========================
           HERZ
        ========================= */

        .heart {
            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }


        /* =========================
           TEXT
        ========================= */

        .small-text {
            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .question-text {
            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 18px;

            line-height: 1.7;
        }


        /* =========================
           BUTTON-BEREICH
        ========================= */

        .button-area {
            position: relative;

            width: 100%;
            max-width: 560px;

            height: 220px;
        }


        /* =========================
           ALLGEMEINE BUTTONS
        ========================= */

        button {
            border: none;
            outline: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 999px;

            padding: 17px 35px;

            cursor: pointer;

            transition:
                left 0.35s ease,
                top 0.35s ease,
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }


        /* =========================
           JA BUTTON
        ========================= */

        #yesButton {
            position: absolute;

            z-index: 3;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );

            box-shadow:
                0 10px 30px
                rgba(255, 47, 104, 0.35);
        }

        #yesButton:hover {
            box-shadow:
                0 15px 40px
                rgba(255, 47, 104, 0.55);
        }


        /* =========================
           NEIN BUTTON
        ========================= */

        #noButton {
            position: absolute;

            z-index: 4;

            color: white;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);
        }

        #noButton:hover {
            background:
                rgba(255, 255, 255, 0.12);
        }


        /* =========================
           HINWEIS
        ========================= */

        .hint {
            position: absolute;

            bottom: 20px;

            color:
                rgba(255, 255, 255, 0.35);

            font-size: 13px;
        }


        /* =========================
           ERFOLG
        ========================= */

        .success {
            position: fixed;

            inset: 0;

            z-index: 20;

            display: none;

            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 47, 104, 0.25),
                    rgba(0, 0, 0, 0.96)
                );
        }

        .success-content {
            padding: 30px;

            animation:
                successAppear 1s ease forwards;
        }

        .success-heart {
            font-size: 110px;

            margin-bottom: 25px;

            animation:
                heartbeat 1s infinite;
        }

        .success h2 {
            font-size:
                clamp(45px, 9vw, 90px);

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success p {
            font-size: 21px;

            color:
                rgba(255, 255, 255, 0.8);

            line-height: 1.7;
        }


        /* =========================
           HERZEN
        ========================= */

        .floating-heart {
            position: fixed;

            bottom: -50px;

            z-index: 30;

            font-size: 25px;

            pointer-events: none;

            animation:
                floatHeart 5s linear forwards;
        }


        /* =========================
           ANIMATIONEN
        ========================= */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes successAppear {

            from {
                opacity: 0;

                transform:
                    scale(0.8);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           HANDY
        ========================= */

        @media (max-width: 600px) {

            .card {
                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;
            }

            .heart {
                font-size: 60px;
            }

            .question-text {
                font-size: 16px;

                margin-bottom: 25px;
            }

            .button-area {
                height: 230px;
            }

            button {
                font-size: 16px;

                padding:
                    15px 27px;
            }

            .hint {
                bottom: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HINTERGRUND
    ========================= -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =========================
         HAUPTKARTE
    ========================= -->

    <div
        class="card"
        id="mainCard"
    >

        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">
            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭
        </p>



        <!-- BUTTON-BEREICH -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >
                Nein 🙈
            </button>

        </div>


        <div class="hint">
            Eine Antwort macht mich glücklich... 🥰
        </div>

    </div>



    <!-- =========================
         ERFOLGSSEITE
    ========================= -->

    <div
        class="success"
        id="success"
    >

        <div class="success-content">

            <div class="success-heart">
                ❤️
            </div>

            <h2>
                Jaaaa! 🥰
            </h2>

            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        let yesScale = 1;

        let noClickCount = 0;


        const yesButton =
            document.getElementById("yesButton");

        const noButton =
            document.getElementById("noButton");

        const buttonArea =
            document.getElementById("buttonArea");


        /*
         * Texte des NEIN-Buttons
         */

        const noTexts = [
            "Nein 🙈",
            "Bist du sicher? 🤭",
            "Wirklich? 🥺",
            "Denk nochmal nach 😏",
            "Ganz sicher? ❤️",
            "Letzte Chance 😂",
            "Okay... wirklich Nein? 🥺"
        ];


        /*
         * Prüft, ob sich zwei
         * Rechtecke überschneiden.
         *
         * gap = Sicherheitsabstand
         */

        function rectanglesOverlap(
            rect1,
            rect2,
            gap = 15
        ) {

            return !(
                rect1.right + gap < rect2.left ||
                rect1.left - gap > rect2.right ||
                rect1.bottom + gap < rect2.top ||
                rect1.top - gap > rect2.bottom
            );

        }


        /*
         * Sucht eine sichere Position
         * für den NEIN-Button.
         */

        function findSafePosition() {

            const areaRect =
                buttonArea.getBoundingClientRect();

            const yesRect =
                yesButton.getBoundingClientRect();

            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;


            const padding = 15;


            const maxX =
                areaRect.width -
                noWidth -
                padding * 2;

            const maxY =
                areaRect.height -
                noHeight -
                padding * 2;


            /*
             * Wir probieren viele
             * zufällige Positionen.
             */

            for (
                let attempt = 0;
                attempt < 1000;
                attempt++
            ) {

                const x =
                    padding +
                    Math.random() *
                    Math.max(maxX, 0);

                const y =
                    padding +
                    Math.random() *
                    Math.max(maxY, 0);


                /*
                 * Position des möglichen
                 * NEIN-Buttons berechnen.
                 */

                const noRect = {

                    left:
                        areaRect.left + x,

                    top:
                        areaRect.top + y,

                    right:
                        areaRect.left +
                        x +
                        noWidth,

                    bottom:
                        areaRect.top +
                        y +
                        noHeight

                };


                /*
                 * Prüfen, ob NEIN
                 * den JA-Button berührt.
                 */

                const collision =
                    rectanglesOverlap(
                        noRect,
                        yesRect,
                        18
                    );


                /*
                 * Keine Kollision?
                 *
                 * Dann verwenden wir
                 * diese Position.
                 */

                if (!collision) {

                    return {
                        x: x,
                        y: y
                    };

                }

            }


            /*
             * Falls zufällig keine
             * Position gefunden wurde,
             * suchen wir systematisch
             * nach einer Position.
             */

            const step = 10;


            for (
                let y = padding;
                y <= maxY + padding;
                y += step
            ) {

                for (
                    let x = padding;
                    x <= maxX + padding;
                    x += step
                ) {

                    const noRect = {

                        left:
                            areaRect.left + x,

                        top:
                            areaRect.top + y,

                        right:
                            areaRect.left +
                            x +
                            noWidth,

                        bottom:
                            areaRect.top +
                            y +
                            noHeight

                    };


                    const collision =
                        rectanglesOverlap(
                            noRect,
                            yesRect,
                            18
                        );


                    if (!collision) {

                        return {
                            x: x,
                            y: y
                        };

                    }

                }

            }


            /*
             * Eigentlich sollte dieser
             * Fall kaum auftreten.
             */

            return null;

        }


        /*
         * NEIN wurde gedrückt
         */

        function sayNo() {

            noClickCount++;


            /*
             * JA wird größer.
             */

            yesScale *= 1.12;


            /*
             * Maximale Größe.
             */

            if (yesScale > 3.0) {

                yesScale = 3.0;

            }


            /*
             * JA-Button skalieren.
             */

            yesButton.style.transform =
                `
                translate(-50%, -50%)
                scale(${yesScale})
                `;


            /*
             * Text ändern.
             */

            const textIndex =
                Math.min(
                    noClickCount,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];


            /*
             * Warten, bis der Browser
             * die neue Buttongröße
             * berechnet hat.
             */

            requestAnimationFrame(() => {

                const position =
                    findSafePosition();


                /*
                 * Nur wenn tatsächlich
                 * eine sichere Position
                 * gefunden wurde.
                 */

                if (position !== null) {

                    noButton.style.left =
                        `${position.x}px`;

                    noButton.style.top =
                        `${position.y}px`;

                }

            });

        }


        /*
         * JA wurde gedrückt
         */

        function sayYes() {

            document
                .getElementById("mainCard")
                .style.display = "none";


            document
                .getElementById("success")
                .style.display = "flex";


            createHearts();

        }


        /*
         * Herzen erzeugen
         */

        function createHearts() {

            const heartTypes = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"
            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {

                setTimeout(() => {

                    const heart =
                        document.createElement("div");


                    heart.className =
                        "floating-heart";


                    heart.innerText =
                        heartTypes[
                            Math.floor(
                                Math.random() *
                                heartTypes.length
                            )
                        ];


                    heart.style.left =
                        Math.random() *
                        100 +
                        "vw";


                    heart.style.fontSize =
                        (
                            18 +
                            Math.random() * 25
                        ) + "px";


                    heart.style.animationDuration =
                        (
                            3 +
                            Math.random() * 3
                        ) + "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 6500);

                }, i * 80);

            }

        }


        /*
         * Beim Laden eine erste
         * sichere Position finden.
         */

        window.addEventListener(
            "load",
            () => {

                const areaRect =
                    buttonArea.getBoundingClientRect();

                const yesRect =
                    yesButton.getBoundingClientRect();

                const noWidth =
                    noButton.offsetWidth;

                const noHeight =
                    noButton.offsetHeight;


                /*
                 * Wir versuchen zuerst,
                 * NEIN rechts vom JA-Button
                 * zu positionieren.
                 */

                const preferredX =
                    areaRect.width * 0.68 -
                    noWidth / 2;

                const preferredY =
                    areaRect.height * 0.5 -
                    noHeight / 2;


                const preferredRect = {

                    left:
                        areaRect.left +
                        preferredX,

                    top:
                        areaRect.top +
                        preferredY,

                    right:
                        areaRect.left +
                        preferredX +
                        noWidth,

                    bottom:
                        areaRect.top +
                        preferredY +
                        noHeight

                };


                if (
                    !rectanglesOverlap(
                        preferredRect,
                        yesRect,
                        18
                    )
                ) {

                    noButton.style.left =
                        `${preferredX}px`;

                    noButton.style.top =
                        `${preferredY}px`;

                }
                else {

                    /*
                     * Falls die Standardposition
                     * nicht passt, suchen wir
                     * automatisch eine andere.
                     */

                    const position =
                        findSafePosition();


                    if (position !== null) {

                        noButton.style.left =
                            `${position.x}px`;

                        noButton.style.top =
                            `${position.y}px`;

                    }

                }

            }
        );


        /*
         * Wenn das Fenster verändert
         * wird, z.B. Handy drehen,
         * suchen wir erneut eine
         * sichere Position.
         */

        window.addEventListener(
            "resize",
            () => {

                const position =
                    findSafePosition();


                if (position !== null) {

                    noButton.style.left =
                        `${position.x}px`;

                    noButton.style.top =
                        `${position.y}px`;

                }

            }
        );

    </script>

</body>
</html>
