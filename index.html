<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 55, 115, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(160, 60, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1b0814,
                    #080409
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow.one {

            width: 320px;
            height: 320px;

            background: #ff2f68;

            left: -110px;
            top: -120px;
        }


        .glow.two {

            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }



        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;

            width: min(
                700px,
                92vw
            );

            min-height: 540px;

            padding:
                45px 30px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );


            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );


            border-radius: 32px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                ),

                inset 0 0 30px
                rgba(
                    255,
                    255,
                    255,
                    0.02
                );


            animation:
                cardAppear 0.8s ease;
        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 65px;

            margin-bottom: 15px;

            animation:
                heartbeat
                1.8s
                ease-in-out
                infinite;
        }



        /* =====================================================
           KLEINER TEXT
        ===================================================== */

        .eyebrow {

            margin-bottom: 12px;

            color:
                #ff9db8;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }



        /* =====================================================
           TITEL
        ===================================================== */

        h1 {

            margin-bottom: 20px;

            font-size:
                clamp(
                    42px,
                    8vw,
                    75px
                );

            line-height: 1;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb4ca
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }



        /* =====================================================
           TEXT
        ===================================================== */

        .description {

            max-width: 520px;

            margin-bottom: 20px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.75
                );

            font-size: 18px;

            line-height: 1.7;
        }



        /* =====================================================
           BUTTON-STAGE

           NUR HIER DARF NEIN HERUMSPRINGEN.
        ===================================================== */

        .button-stage {

            position: relative;

            width: min(
                560px,
                100%
            );

            height: 220px;

            margin-top: 5px;

            overflow: hidden;

            border-radius: 25px;
        }



        /* =====================================================
           BUTTON-GRUNDSTYLING
        ===================================================== */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 999px;

            padding:
                16px 32px;

            cursor: pointer;

            user-select: none;

            white-space: nowrap;

            -webkit-tap-highlight-color:
                transparent;
        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        #yesButton {

            position: absolute;

            left: 36%;

            top: 50%;


            z-index: 10;


            transform:

                translate(
                    -50%,
                    -50%
                )

                scale(1);


            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(
                    255,
                    47,
                    104,
                    0.35
                );


            transition:

                transform
                0.35s ease,

                box-shadow
                0.25s ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(
                    255,
                    47,
                    104,
                    0.55
                );
        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        #noButton {

            position: absolute;

            left: 64%;

            top: 50%;


            z-index: 20;


            transform:

                translate(
                    -50%,
                    -50%
                );


            color: white;


            background:

                rgba(
                    255,
                    255,
                    255,
                    0.10
                );


            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );


            transition:

                background
                0.2s ease;
        }


        #noButton:hover {

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.16
                );
        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            margin-top: 5px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            font-size: 13px;
        }



        /* =====================================================
           ERFOLGSSEITE
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 25px;

            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(
                        255,
                        47,
                        104,
                        0.28
                    ),

                    rgba(
                        0,
                        0,
                        0,
                        0.96
                    )
                );
        }


        .success-content {

            animation:
                successAppear
                0.8s ease;
        }


        .success-heart {

            font-size: 100px;

            margin-bottom: 20px;

            animation:
                heartbeat
                1s
                infinite;
        }


.success h2 {
    margin-bottom: 20px;

    font-size:
        clamp(
            48px,
            9vw,
            90px
        );
}

.success-title {
    background:
        linear-gradient(
            90deg,
            #ff5c8a,
            #ffc5d6
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


        .success p {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            font-size: 20px;

            line-height: 1.7;
        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;

            bottom: -40px;

            z-index: 500;

            pointer-events: none;

            font-size: 25px;

            animation:

                floatHeart
                5s
                linear
                forwards;
        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);
            }


            50% {

                transform:
                    scale(1.15);
            }
        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-25px);
            }
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.8);
            }


            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }


            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }



        /* =====================================================
           HANDY
        ===================================================== */

        @media (
            max-width: 600px
        ) {

            .card {

                width: 92vw;

                min-height: 550px;

                padding:
                    35px 16px;
            }


            .heart {

                font-size: 55px;
            }


            .description {

                max-width: 90%;

                font-size: 16px;

                line-height: 1.6;
            }


            /*
             * Höherer Bereich fürs Handy.
             */

            .button-stage {

                width: 100%;

                height: 280px;
            }


            /*
             * Startpositionen Handy.
             */

            #yesButton {

                left: 35%;
            }


            #noButton {

                left: 65%;
            }


            button {

                font-size: 16px;

                padding:
                    14px 23px;
            }


            .hint {

                font-size: 12px;
            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <main
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="eyebrow">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="description">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             BUTTON BEREICH
        ================================================== -->

        <div
            class="button-stage"
            id="buttonStage"
        >


            <button
                id="yesButton"
                type="button"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                type="button"
            >
                Nein 🙈
            </button>


        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>


    </main>



    <!-- =====================================================
         ERFOLG
    ===================================================== -->

    <section
        class="success"
        id="success"
    >


        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
    <span class="success-title">Jaaaa!</span> 🥰
           </h2>


            <p>

                Ich wusste doch,
                dass du mich magst. ❤️

            </p>


        </div>


    </section>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const stage =
            document.getElementById(
                "buttonStage"
            );


        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );


        const mainCard =
            document.getElementById(
                "mainCard"
            );


        const success =
            document.getElementById(
                "success"
            );



        /* =====================================================
           VARIABLEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        /*
         * JA wächst bei jedem NEIN-Klick
         * um 12 %.
         */

        const growthFactor =
            1.12;


        /*
         * Maximale Größe.
         */

        const maximumYesScale =
            2.2;


        /*
         * Abstand zwischen JA
         * und NEIN.
         */

        const safetyGap =
            30;


        /*
         * Abstand vom Rand
         * der Button-Stage.
         */

        const stagePadding =
            12;



        /* =====================================================
           NEIN-TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich gebe nicht auf 😂",

            "Du machst es mir schwer 😏"

        ];



        /* =====================================================
           RECHTECK-ÜBERSCHNEIDUNG
        ===================================================== */

        function rectanglesOverlap(
            a,
            b,
            gap = 0
        ) {

            return (

                a.left
                <
                b.right + gap

                &&

                a.right
                >
                b.left - gap

                &&

                a.top
                <
                b.bottom + gap

                &&

                a.bottom
                >
                b.top - gap

            );

        }



        /* =====================================================
           JA-RECHTECK IN DER BUTTON-STAGE
        ===================================================== */

        function getYesRectInStage() {


            const stageRect =
                stage.getBoundingClientRect();


            const yesRect =
                yesButton.getBoundingClientRect();


            return {

                left:
                    yesRect.left
                    -
                    stageRect.left,

                top:
                    yesRect.top
                    -
                    stageRect.top,

                right:
                    yesRect.right
                    -
                    stageRect.left,

                bottom:
                    yesRect.bottom
                    -
                    stageRect.top

            };

        }



        /* =====================================================
           NEIN-RECHTECK AUS EINEM MITTELPUNKT
        ===================================================== */

        function createNoRect(
            centerX,
            centerY
        ) {


            const width =
                noButton.offsetWidth;


            const height =
                noButton.offsetHeight;


            return {

                left:
                    centerX
                    -
                    width / 2,

                top:
                    centerY
                    -
                    height / 2,

                right:
                    centerX
                    +
                    width / 2,

                bottom:
                    centerY
                    +
                    height / 2

            };

        }



        /* =====================================================
           LIEGT DER BUTTON VOLLSTÄNDIG
           INNERHALB DER STAGE?
        ===================================================== */

        function isInsideStage(
            rect
        ) {


            return (

                rect.left
                >=
                stagePadding

                &&

                rect.top
                >=
                stagePadding

                &&

                rect.right
                <=
                stage.clientWidth
                -
                stagePadding

                &&

                rect.bottom
                <=
                stage.clientHeight
                -
                stagePadding

            );

        }



        /* =====================================================
           NEUE POSITION SUCHEN
        ===================================================== */

        function findSafePosition() {


            const yesRect =
                getYesRectInStage();


            const width =
                noButton.offsetWidth;


            const height =
                noButton.offsetHeight;



            /*
             * Erlaubter Bereich für
             * den MITTELPUNKT von NEIN.
             */

            const minX =
                stagePadding
                +
                width / 2;


            const maxX =
                stage.clientWidth
                -
                stagePadding
                -
                width / 2;


            const minY =
                stagePadding
                +
                height / 2;


            const maxY =
                stage.clientHeight
                -
                stagePadding
                -
                height / 2;



            /*
             * Wenn zu wenig Platz existiert,
             * bleibt der Button stehen.
             */

            if (
                maxX <= minX
                ||
                maxY <= minY
            ) {

                return null;

            }



            /*
             * Bis zu 5000 zufällige
             * Positionen ausprobieren.
             */

            for (
                let attempt = 0;
                attempt < 5000;
                attempt++
            ) {


                const x =

                    minX
                    +
                    Math.random()
                    *
                    (
                        maxX -
                        minX
                    );


                const y =

                    minY
                    +
                    Math.random()
                    *
                    (
                        maxY -
                        minY
                    );



                /*
                 * Rechteck für NEIN.
                 */

                const noRect =
                    createNoRect(
                        x,
                        y
                    );



                /*
                 * Sicherheitsprüfung
                 * Bildschirmbereich.
                 */

                if (
                    !isInsideStage(
                        noRect
                    )
                ) {

                    continue;

                }



                /*
                 * Sicherheitsprüfung
                 * JA-Button.
                 */

                if (
                    rectanglesOverlap(
                        noRect,
                        yesRect,
                        safetyGap
                    )
                ) {

                    continue;

                }



                /*
                 * Sichere Position gefunden.
                 */

                return {
                    x,
                    y
                };

            }



            /*
             * Fallback:
             * feste sichere Ecken.
             */

            const fallback = [

                {
                    x: minX,
                    y: minY
                },

                {
                    x: maxX,
                    y: minY
                },

                {
                    x: minX,
                    y: maxY
                },

                {
                    x: maxX,
                    y: maxY
                }

            ];


            for (
                const position
                of fallback
            ) {


                const noRect =
                    createNoRect(
                        position.x,
                        position.y
                    );


                if (

                    isInsideStage(
                        noRect
                    )

                    &&

                    !rectanglesOverlap(
                        noRect,
                        yesRect,
                        safetyGap
                    )

                ) {

                    return position;

                }

            }



            /*
             * Wenn wirklich keine Position
             * mehr existiert:
             * nichts verändern.
             */

            return null;

        }



        /* =====================================================
           NEIN TELEPORTIEREN
        ===================================================== */

        function moveNoButton() {


            const position =
                findSafePosition();


            /*
             * Keine sichere Position?
             * Dann NICHTS machen.

             * Dadurch verschwindet der Button
             * niemals.
             */

            if (
                position === null
            ) {

                return;

            }



            /*
             * Neue Position setzen.

             * Wichtig:
             * KEINE left/top transition.
             */

            noButton.style.left =
                `${position.x}px`;


            noButton.style.top =
                `${position.y}px`;

        }



        /* =====================================================
           NEIN GEKLICKT
        ===================================================== */

        noButton.addEventListener(
            "click",
            () => {


                noClicks++;



                /*
                 * JA vergrößern.
                 */

                yesScale *=
                    growthFactor;


                if (
                    yesScale
                    >
                    maximumYesScale
                ) {

                    yesScale =
                        maximumYesScale;

                }


                yesButton.style.transform =

                    `
                    translate(-50%, -50%)
                    scale(${yesScale})
                    `;



                /*
                 * Text wechseln.
                 */

                const textIndex =
                    Math.min(
                        noClicks,
                        noTexts.length - 1
                    );


                noButton.innerText =
                    noTexts[textIndex];



                /*
                 * Einen Frame warten.

                 * Danach hat der Browser
                 * die neue Größe von JA
                 * berechnet.
                 */

                requestAnimationFrame(
                    () => {

                        moveNoButton();

                    }
                );

            }
        );



        /* =====================================================
           JA GEKLICKT
        ===================================================== */

        yesButton.addEventListener(
            "click",
            () => {


                /*
                 * Hauptkarte ausblenden.
                 */

                mainCard.style.display =
                    "none";


                /*
                 * Erfolg anzeigen.
                 */

                success.style.display =
                    "flex";


                /*
                 * Herzen.
                 */

                createHearts();

            }
        );



        /* =====================================================
           HERZEN ERZEUGEN
        ===================================================== */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(
                    () => {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.className =
                            "floating-heart";


                        heart.innerText =
                            heartTypes[
                                Math.floor(
                                    Math.random()
                                    *
                                    heartTypes.length
                                )
                            ];


                        heart.style.left =

                            Math.random()
                            *
                            100
                            +
                            "vw";


                        heart.style.fontSize =

                            (
                                18
                                +
                                Math.random()
                                *
                                25
                            )
                            +
                            "px";


                        heart.style.animationDuration =

                            (
                                3
                                +
                                Math.random()
                                *
                                3
                            )
                            +
                            "s";


                        document.body.appendChild(
                            heart
                        );


                        setTimeout(
                            () => {

                                heart.remove();

                            },

                            6500
                        );


                    },

                    i * 70
                );

            }

        }

    </script>

</body>

</html>
