<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;
            align-items: center;


            font-family:
                Arial,
                Helvetica,
                sans-serif;


            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;
        }


        .glow-1 {

            width: 320px;
            height: 320px;

            background: #ff2f68;

            left: -100px;
            top: -120px;
        }


        .glow-2 {

            width: 320px;
            height: 320px;

            background: #9c27ff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }



        /* =====================================================
           HAUPTKARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;


            width: min(700px, 90%);

            min-height: 540px;


            padding:
                60px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255, 255, 255, 0.07);


            border:
                1px solid
                rgba(255, 255, 255, 0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.45),

                inset 0 0 30px
                rgba(255,255,255,0.02);


            animation:
                cardAppear 1s ease;
        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }



        /* =====================================================
           KLEINER TEXT
        ===================================================== */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }



        /* =====================================================
           TITEL
        ===================================================== */

        h1 {

            margin-bottom: 25px;

            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }



        /* =====================================================
           BESCHREIBUNG
        ===================================================== */

        .question-text {

            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255,255,255,0.75);

            font-size: 18px;

            line-height: 1.7;
        }



        /* =====================================================
           BUTTON-BEREICH

           Nur beim Start relevant.

           Beide Buttons liegen hier nebeneinander.
        ===================================================== */

        .button-area {

            width: 100%;

            min-height: 110px;


            display: flex;

            justify-content: center;

            align-items: center;


            gap: 30px;
        }



        /* =====================================================
           BUTTON-GRUNDSTYLE
        ===================================================== */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;


            border-radius: 999px;


            padding:
                17px 35px;


            cursor: pointer;

            user-select: none;

            white-space: nowrap;
        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        #yesButton {

            position: relative;

            z-index: 10;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255,47,104,0.35);


            transform:
                scale(1);


            transform-origin:
                center center;


            transition:

                transform 350ms ease,

                box-shadow 300ms ease;
        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255,47,104,0.55);
        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        #noButton {

            position: relative;

            z-index: 20;


            color: white;


            background:
                rgba(255,255,255,0.10);


            border:
                1px solid
                rgba(255,255,255,0.18);


            /*
             * Nur die Hintergrundfarbe wird
             * per CSS animiert.

             * Die eigentliche Flugbewegung
             * übernimmt JavaScript.
             */

            transition:
                background 200ms ease,
                transform 120ms ease;
        }


        #noButton:hover {

            background:
                rgba(255,255,255,0.16);

        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            position: absolute;

            bottom: 20px;


            color:
                rgba(255,255,255,0.35);


            font-size: 13px;
        }



        /* =====================================================
           ERFOLGSSEITE
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;

            z-index: 5000;


            display: none;


            justify-content: center;

            align-items: center;


            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255,47,104,0.25),
                    rgba(0,0,0,0.96)
                );
        }


        .success-content {

            padding: 30px;

            animation:
                successAppear 1s ease;
        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;


            animation:
                heartbeat 1s infinite;
        }


        .success h2 {

            margin-bottom: 20px;

            font-size:
                clamp(45px,9vw,90px);


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .success p {

            color:
                rgba(255,255,255,0.8);


            font-size: 21px;

            line-height: 1.7;
        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;

            font-size: 25px;


            animation:
                floatHeart 5s linear forwards;
        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);
            }


            50% {

                transform:
                    scale(1.15);
            }

        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-30px);
            }

        }


        @keyframes cardAppear {

            from {

                opacity: 0;


                transform:

                    translateY(35px)
                    scale(0.96);
            }


            to {

                opacity: 1;


                transform:

                    translateY(0)
                    scale(1);
            }

        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.8);
            }


            to {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }


            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;
            }


            .heart {

                font-size: 60px;
            }


            .question-text {

                font-size: 16px;

                margin-bottom: 25px;
            }


            .button-area {

                gap: 12px;

            }


            button {

                font-size: 16px;

                padding:
                    15px 24px;

            }


            .hint {

                bottom: 15px;

            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         HAUPTKARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             START-BUTTONS
        ================================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >
                Nein 🙈
            </button>

        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>


    </div>



    <!-- =====================================================
         ERFOLG
    ===================================================== -->

    <div
        class="success"
        id="success"
    >

        <div class="success-content">


            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>

                Ich wusste doch,
                dass du mich magst. ❤️

            </p>


        </div>

    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );



        /* =====================================================
           VARIABLEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;

        let isFlying = false;

        let hasStartedFlying = false;



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        const growthFactor = 1.12;

        const maximumYesScale = 2.5;

        const screenPadding = 20;

        const yesSafetyGap = 35;



        /* =====================================================
           NEIN-TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich lauf weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           RECHTECK ERSTELLEN
        ===================================================== */

        function makeRect(
            left,
            top,
            width,
            height
        ) {

            return {

                left: left,

                top: top,

                right:
                    left + width,

                bottom:
                    top + height

            };

        }



        /* =====================================================
           PRÜFEN, OB ZWEI RECHTECKE
           SICH BERÜHREN
        ===================================================== */

        function rectanglesTouch(
            a,
            b,
            gap = 0
        ) {

            return (

                a.left
                <
                b.right + gap &&

                a.right
                >
                b.left - gap &&

                a.top
                <
                b.bottom + gap &&

                a.bottom
                >
                b.top - gap

            );

        }



        /* =====================================================
           PRÜFEN, OB NEIN AUF DEM
           BILDSCHIRM BLEIBT
        ===================================================== */

        function isInsideScreen(
            rect
        ) {

            return (

                rect.left >=
                    screenPadding &&

                rect.top >=
                    screenPadding &&

                rect.right <=
                    window.innerWidth
                    -
                    screenPadding &&

                rect.bottom <=
                    window.innerHeight
                    -
                    screenPadding

            );

        }



        /* =====================================================
           PRÜFEN, OB EIN KOMPLETTER
           FLUGWEG SICHER IST
        ===================================================== */

        function isPathSafe(
            start,
            end
        ) {

            /*
             * Aktuelle tatsächliche Größe
             * des JA Buttons.
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Größe des NEIN Buttons.
             */

            const noWidth =
                noButton.offsetWidth;


            const noHeight =
                noButton.offsetHeight;


            /*
             * Wir prüfen 250 Punkte
             * entlang des Flugweges.

             * Dadurch sehen wir auch Kollisionen
             * während der Bewegung.
             */

            const steps = 250;


            for (
                let i = 0;
                i <= steps;
                i++
            ) {


                const progress =
                    i / steps;


                const centerX =

                    start.x
                    +
                    (
                        end.x
                        -
                        start.x
                    )
                    *
                    progress;


                const centerY =

                    start.y
                    +
                    (
                        end.y
                        -
                        start.y
                    )
                    *
                    progress;



                /*
                 * Rechteck des NEIN Buttons
                 * an dieser Stelle.
                 */

                const noRect =

                    makeRect(

                        centerX
                        -
                        noWidth / 2,

                        centerY
                        -
                        noHeight / 2,

                        noWidth,

                        noHeight

                    );



                /*
                 * Bildschirm prüfen.
                 */

                if (
                    !isInsideScreen(
                        noRect
                    )
                ) {

                    return false;

                }



                /*
                 * Abstand zu JA prüfen.
                 */

                if (
                    rectanglesTouch(
                        noRect,
                        yesRect,
                        yesSafetyGap
                    )
                ) {

                    return false;

                }

            }


            return true;

        }



        /* =====================================================
           SICHERES ZIEL SUCHEN
        ===================================================== */

        function findSafeTarget(
            start
        ) {


            /*
             * Größe des NEIN Buttons.
             */

            const noWidth =
                noButton.offsetWidth;


            const noHeight =
                noButton.offsetHeight;



            /*
             * =================================================
             * 1. DIREKTE ZIELE AUSPROBIEREN
             * =================================================
             */

            for (
                let attempt = 0;
                attempt < 3000;
                attempt++
            ) {


                const target = {

                    x:

                        screenPadding
                        +
                        noWidth / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerWidth
                            -
                            2 *
                            screenPadding
                            -
                            noWidth
                        ),


                    y:

                        screenPadding
                        +
                        noHeight / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerHeight
                            -
                            2 *
                            screenPadding
                            -
                            noHeight
                        )

                };



                /*
                 * Direktes Ziel testen.
                 */

                if (
                    isPathSafe(
                        start,
                        target
                    )
                ) {

                    return [
                        start,
                        target
                    ];

                }

            }



            /* =================================================
               2. FALLBACK:

               Umwege über mehrere Punkte.
            ================================================= */

            const yesRect =
                yesButton.getBoundingClientRect();


            const margin =
                yesSafetyGap
                +
                noWidth / 2
                +
                30;



            /*
             * Punkte rund um JA.
             */

            const waypoints = [

                /*
                 * oben links
                 */

                {
                    x:
                        yesRect.left
                        -
                        margin,

                    y:
                        yesRect.top
                        -
                        margin
                },


                /*
                 * oben rechts
                 */

                {
                    x:
                        yesRect.right
                        +
                        margin,

                    y:
                        yesRect.top
                        -
                        margin
                },


                /*
                 * unten rechts
                 */

                {
                    x:
                        yesRect.right
                        +
                        margin,

                    y:
                        yesRect.bottom
                        +
                        margin
                },


                /*
                 * unten links
                 */

                {
                    x:
                        yesRect.left
                        -
                        margin,

                    y:
                        yesRect.bottom
                        +
                        margin
                }

            ];



            /*
             * Alle Wegpunkte überprüfen.
             */

            for (
                const waypoint
                of waypoints
            ) {


                /*
                 * Wegpunkt muss im Bildschirm
                 * liegen.
                 */

                if (

                    waypoint.x < noWidth / 2
                    ||

                    waypoint.x >
                        window.innerWidth
                        -
                        noWidth / 2

                    ||

                    waypoint.y < noHeight / 2
                    ||

                    waypoint.y >
                        window.innerHeight
                        -
                        noHeight / 2

                ) {

                    continue;

                }



                /*
                 * Zufälliges Ziel.
                 */

                const target = {

                    x:

                        screenPadding
                        +
                        noWidth / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerWidth
                            -
                            2 *
                            screenPadding
                            -
                            noWidth
                        ),


                    y:

                        screenPadding
                        +
                        noHeight / 2
                        +
                        Math.random()
                        *
                        (
                            window.innerHeight
                            -
                            2 *
                            screenPadding
                            -
                            noHeight
                        )

                };



                /*
                 * Start → Wegpunkt
                 */

                if (
                    !isPathSafe(
                        start,
                        waypoint
                    )
                ) {

                    continue;

                }



                /*
                 * Wegpunkt → Ziel
                 */

                if (
                    !isPathSafe(
                        waypoint,
                        target
                    )
                ) {

                    continue;

                }



                /*
                 * Sichere Route gefunden.
                 */

                return [

                    start,

                    waypoint,

                    target

                ];

            }



            /*
             * =================================================
             * 3. NOTFALL
             * =================================================
             *
             * Falls auf einem sehr kleinen Bildschirm
             * kaum Platz vorhanden ist, nehmen wir
             * eine sichere obere Ecke.
             */

            const fallback = {

                x:
                    noWidth / 2
                    +
                    screenPadding,

                y:
                    noHeight / 2
                    +
                    screenPadding

            };


            return [

                start,

                fallback

            ];

        }



        /* =====================================================
           GESAMTLÄNGE EINES FLUGWEGES
        ===================================================== */

        function getPathLength(
            path
        ) {

            let length = 0;


            for (
                let i = 1;
                i < path.length;
                i++
            ) {


                length +=

                    Math.hypot(

                        path[i].x
                        -
                        path[i - 1].x,

                        path[i].y
                        -
                        path[i - 1].y

                    );

            }


            return length;

        }



        /* =====================================================
           POSITION ENTLANG DES PFADES
        ===================================================== */

        function getPointAlongPath(
            path,
            distance
        ) {

            let travelled = 0;


            for (
                let i = 1;
                i < path.length;
                i++
            ) {


                const a =
                    path[i - 1];


                const b =
                    path[i];


                const segmentLength =

                    Math.hypot(

                        b.x - a.x,

                        b.y - a.y

                    );


                if (
                    travelled
                    +
                    segmentLength
                    >=
                    distance
                ) {


                    const localProgress =

                        (
                            distance
                            -
                            travelled
                        )
                        /
                        segmentLength;


                    return {

                        x:

                            a.x
                            +
                            (
                                b.x
                                -
                                a.x
                            )
                            *
                            localProgress,


                        y:

                            a.y
                            +
                            (
                                b.y
                                -
                                a.y
                            )
                            *
                            localProgress

                    };

                }


                travelled +=
                    segmentLength;

            }


            return path[
                path.length - 1
            ];

        }



        /* =====================================================
           SMOOTH FLUG
        ===================================================== */

        function flyNoButton(
            path
        ) {


            /*
             * Gesamtlänge.
             */

            const totalDistance =
                getPathLength(path);


            /*
             * Fluggeschwindigkeit.

             * Nicht zu schnell,
             * nicht zu langsam.
             */

            const duration =

                Math.max(

                    700,

                    Math.min(

                        1800,

                        totalDistance
                        *
                        1.4

                    )

                );


            const startTime =
                performance.now();



            function animate(
                currentTime
            ) {


                const elapsed =
                    currentTime
                    -
                    startTime;


                let progress =
                    elapsed
                    /
                    duration;


                if (
                    progress > 1
                ) {

                    progress = 1;

                }



                /*
                 * Smooth ease-in-out.
                 */

                const eased =

                    progress < 0.5

                        ?

                    2 *
                    progress *
                    progress

                        :

                    1 -
                    Math.pow(
                        -2 * progress + 2,
                        2
                    )
                    /
                    2;



                /*
                 * Punkt entlang des Flugweges.
                 */

                const point =

                    getPointAlongPath(

                        path,

                        totalDistance
                        *
                        eased

                    );



                /*
                 * Linke obere Ecke setzen.

                 * Dadurch bleibt der komplette
                 * Button innerhalb des berechneten Weges.
                 */

                noButton.style.left =

                    (
                        point.x
                        -
                        noButton.offsetWidth / 2
                    )
                    +
                    "px";


                noButton.style.top =

                    (
                        point.y
                        -
                        noButton.offsetHeight / 2
                    )
                    +
                    "px";



                /*
                 * Kleine Rotation während
                 * des Fluges.
                 */

                const rotation =

                    Math.sin(
                        progress
                        *
                        Math.PI
                        *
                        4
                    )
                    *
                    5;


                noButton.style.transform =

                    `rotate(${rotation}deg)`;



                /*
                 * Weiterfliegen?
                 */

                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    /*
                     * Flug beendet.
                     */

                    noButton.style.transform =
                        "none";


                    noButton.style.pointerEvents =
                        "auto";


                    isFlying = false;

                }

            }


            requestAnimationFrame(
                animate
            );

        }



        /* =====================================================
           NEIN BUTTON
        ===================================================== */

        function sayNo() {


            /*
             * Während des Fluges ignorieren.
             */

            if (
                isFlying
            ) {

                return;

            }


            isFlying = true;


            noButton.style.pointerEvents =
                "none";


            noClicks++;



            /* =================================================
               JA GRÖSSER MACHEN
            ================================================= */

            yesScale *= growthFactor;


            /*
             * Maximale Größe.
             */

            if (
                yesScale > maximumYesScale
            ) {

                yesScale =
                    maximumYesScale;

            }


            yesButton.style.transform =
                `scale(${yesScale})`;



            /* =================================================
               NEIN-TEXT ÄNDERN
            ================================================= */

            const textIndex =

                Math.min(

                    noClicks,

                    noTexts.length - 1

                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * Browser erst die neue
             * JA-Größe berechnen lassen.
             */

            requestAnimationFrame(() => {


                /*
                 * Beim ersten Klick:
                 *
                 * aktuelle Position des NEIN Buttons
                 * sauber übernehmen.
                 */

                if (
                    !hasStartedFlying
                ) {


                    const rect =
                        noButton.getBoundingClientRect();


                    /*
                     * Jetzt wird NEIN aus
                     * der Flexbox genommen.
                     */

                    noButton.style.position =
                        "fixed";


                    /*
                     * Exakt gleiche Position
                     * wie vorher.
                     */

                    noButton.style.left =
                        rect.left + "px";


                    noButton.style.top =
                        rect.top + "px";


                    noButton.style.margin =
                        "0";


                    /*
                     * Startzustand merken.
                     */

                    hasStartedFlying = true;

                }



                /*
                 * Noch einen Frame warten,
                 * damit JA seine endgültige
                 * neue Größe hat.
                 */

                requestAnimationFrame(() => {


                    /*
                     * Aktuelle Position von NEIN
                     * bestimmen.
                     */

                    const rect =
                        noButton.getBoundingClientRect();


                    const start = {

                        x:
                            rect.left
                            +
                            rect.width / 2,

                        y:
                            rect.top
                            +
                            rect.height / 2

                    };



                    /*
                     * Sichere Route suchen.
                     */

                    const path =
                        findSafeTarget(
                            start
                        );



                    /*
                     * Route gefunden?
                     */

                    if (
                        path
                    ) {


                        /*
                         * Jetzt beginnt der
                         * tatsächliche Smooth-Flug.
                         */

                        flyNoButton(
                            path
                        );

                    }

                    else {

                        /*
                         * Sollte praktisch nie passieren.
                         */

                        isFlying = false;

                        noButton.style.pointerEvents =
                            "auto";

                    }

                });

            });

        }



        /* =====================================================
           JA BUTTON
        ===================================================== */

        function sayYes() {


            /*
             * Hauptseite ausblenden.
             */

            document
                .getElementById(
                    "mainCard"
                )
                .style.display =
                "none";


            /*
             * NEIN entfernen.
             */

            noButton.style.display =
                "none";


            /*
             * Erfolg anzeigen.
             */

            document
                .getElementById(
                    "success"
                )
                .style.display =
                "flex";


            /*
             * Herzen erzeugen.
             */

            createHearts();

        }



        /* =====================================================
           HERZEN ERZEUGEN
        ===================================================== */

        function createHearts() {


            const heartTypes = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(() => {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerText =

                        heartTypes[
                            Math.floor(
                                Math.random()
                                *
                                heartTypes.length
                            )
                        ];



                    heart.style.left =

                        Math.random()
                        *
                        100
                        +
                        "vw";



                    heart.style.fontSize =

                        (
                            18
                            +
                            Math.random()
                            *
                            25
                        )
                        +
                        "px";



                    heart.style.animationDuration =

                        (
                            3
                            +
                            Math.random()
                            *
                            3
                        )
                        +
                        "s";



                    document.body.appendChild(
                        heart
                    );



                    setTimeout(() => {

                        heart.remove();

                    }, 6500);


                }, i * 70);

            }

        }

    </script>
