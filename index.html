<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eine kleine Frage ❤️</title>


    <style>

        /* =====================================================
           GRUNDLAGEN
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;


            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 60, 120, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(170, 50, 255, 0.22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #10070d,
                    #1c0814,
                    #09050a
                );
        }



        /* =====================================================
           HINTERGRUND
        ===================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

        }


        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            animation:
                floating 8s ease-in-out infinite;

        }


        .glow-1 {

            width: 320px;

            height: 320px;

            background: #ff2f68;

            left: -100px;

            top: -120px;

        }


        .glow-2 {

            width: 320px;

            height: 320px;

            background: #9c27ff;

            right: -100px;

            bottom: -100px;

            animation-delay: 2s;

        }



        /* =====================================================
           KARTE
        ===================================================== */

        .card {

            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            min-height: 540px;

            padding: 60px 40px;


            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;


            text-align: center;


            background:
                rgba(255,255,255,0.07);


            border:
                1px solid
                rgba(255,255,255,0.13);


            border-radius: 35px;


            backdrop-filter:
                blur(20px);


            box-shadow:

                0 30px 100px
                rgba(0,0,0,0.45),

                inset 0 0 30px
                rgba(255,255,255,0.02);


            animation:
                cardAppear 1s ease forwards;

        }



        /* =====================================================
           HERZ
        ===================================================== */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.8s ease-in-out infinite;

        }



        /* =====================================================
           TEXT
        ===================================================== */

        .small-text {

            margin-bottom: 15px;

            color: #ff9db8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        h1 {

            font-size:
                clamp(42px, 8vw, 75px);

            line-height: 1;

            margin-bottom: 25px;


            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb0c7
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .question-text {

            max-width: 520px;

            margin-bottom: 35px;

            color:
                rgba(255,255,255,0.75);

            font-size: 18px;

            line-height: 1.7;

        }



        /* =====================================================
           BUTTON-BEREICH

           Beim Start liegen beide Buttons hier nebeneinander.
        ===================================================== */

        .button-area {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 24px;

            width: 100%;

            min-height: 100px;

        }



        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 999px;

            padding: 17px 35px;

            cursor: pointer;

            user-select: none;

        }



        /* =====================================================
           JA
        ===================================================== */

        #yesButton {

            position: relative;

            z-index: 10;


            transform:
                scale(1);


            transform-origin:
                center center;


            color: white;


            background:

                linear-gradient(
                    135deg,
                    #ff2f68,
                    #ff6d99
                );


            box-shadow:

                0 10px 30px
                rgba(255,47,104,0.35);


            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;

        }


        #yesButton:hover {

            box-shadow:

                0 15px 40px
                rgba(255,47,104,0.55);

        }



        /* =====================================================
           NEIN
        ===================================================== */

        #noButton {

            position: relative;

            z-index: 20;


            color: white;


            background:

                rgba(255,255,255,0.10);


            border:

                1px solid
                rgba(255,255,255,0.18);

        }


        #noButton:hover {

            background:
                rgba(255,255,255,0.16);

        }



        /* =====================================================
           HINWEIS
        ===================================================== */

        .hint {

            position: absolute;

            bottom: 20px;

            color:
                rgba(255,255,255,0.35);

            font-size: 13px;

        }



        /* =====================================================
           ERFOLG
        ===================================================== */

        .success {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            justify-content: center;

            align-items: center;

            text-align: center;


            background:

                radial-gradient(
                    circle,
                    rgba(255,47,104,0.25),
                    rgba(0,0,0,0.96)
                );

        }


        .success-content {

            padding: 30px;

            animation:
                successAppear 1s ease forwards;

        }


        .success-heart {

            font-size: 110px;

            margin-bottom: 25px;

            animation:
                heartbeat 1s infinite;

        }


        .success h2 {

            font-size:
                clamp(45px,9vw,90px);

            margin-bottom: 20px;


            background:

                linear-gradient(
                    90deg,
                    #ff5c8a,
                    #ffc2d4
                );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .success p {

            font-size: 21px;

            color:
                rgba(255,255,255,0.8);

            line-height: 1.7;

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        .floating-heart {

            position: fixed;

            bottom: -50px;

            z-index: 6000;

            pointer-events: none;

            font-size: 25px;

            animation:
                floatHeart 5s linear forwards;

        }



        /* =====================================================
           ANIMATIONEN
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform: scale(0.8);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;

            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;

            }

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92%;

                min-height: 520px;

                padding:
                    40px 20px;

            }


            .heart {
                font-size: 60px;
            }


            .question-text {

                font-size: 16px;

                margin-bottom: 25px;

            }


            .button-area {

                gap: 15px;

            }


            button {

                font-size: 16px;

                padding:
                    15px 27px;

            }


            .hint {

                bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HINTERGRUND
    ===================================================== -->

    <div class="background-glow">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>



    <!-- =====================================================
         KARTE
    ===================================================== -->

    <div
        class="card"
        id="mainCard"
    >


        <div class="heart">
            ❤️
        </div>


        <div class="small-text">
            Eine kleine Frage
        </div>


        <h1>
            Magst du mich?
        </h1>


        <p class="question-text">

            Bevor wir hier weitermachen,
            muss ich natürlich erstmal
            eine ganz wichtige Sache wissen... 🤭

        </p>



        <!-- =================================================
             BEIDE BUTTONS

             Beim Start exakt nebeneinander.
        ================================================== -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                id="yesButton"
                onclick="sayYes()"
            >
                Ja ❤️
            </button>


            <button
                id="noButton"
                onclick="sayNo()"
            >
                Nein 🙈
            </button>

        </div>



        <div class="hint">

            Eine Antwort macht mich glücklich... 🥰

        </div>

    </div>



    <!-- =====================================================
         ERFOLG
    ===================================================== -->

    <div
        class="success"
        id="success"
    >

        <div class="success-content">

            <div class="success-heart">
                ❤️
            </div>


            <h2>
                Jaaaa! 🥰
            </h2>


            <p>
                Ich wusste doch,
                dass du mich magst. ❤️
            </p>

        </div>

    </div>



    <script>


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const yesButton =
            document.getElementById("yesButton");

        const noButton =
            document.getElementById("noButton");



        /* =====================================================
           EINSTELLUNGEN
        ===================================================== */

        let yesScale = 1;

        let noClicks = 0;

        let hasStartedFlying = false;

        let isFlying = false;


        /*
         * JA wächst um 10 %.
         */

        const growthFactor = 1.10;


        /*
         * Maximale Größe.
         */

        const maxYesScale = 2.5;


        /*
         * Sicherheitsabstand.
         */

        const safetyGap = 50;


        /*
         * Abstand vom Bildschirmrand.
         */

        const screenPadding = 20;



        /* =====================================================
           TEXTE
        ===================================================== */

        const noTexts = [

            "Nein 🙈",

            "Bist du sicher? 🤭",

            "Wirklich? 🥺",

            "Denk nochmal nach 😏",

            "Ganz sicher? ❤️",

            "Letzte Chance 😂",

            "Okay... wirklich Nein? 🥺",

            "Warum? 😭",

            "Ich lauf weg 😂",

            "Du bekommst mich nicht 😏"

        ];



        /* =====================================================
           RECHTECK VERGLEICHEN
        ===================================================== */

        function overlaps(
            a,
            b,
            gap
        ) {

            return !(
                a.right + gap < b.left ||
                a.left - gap > b.right ||
                a.bottom + gap < b.top ||
                a.top - gap > b.bottom
            );

        }



        /* =====================================================
           PUNKT IST IM RECHTECK?
        ===================================================== */

        function pointInsideRect(
            point,
            rect
        ) {

            return (

                point.x >= rect.left &&
                point.x <= rect.right &&
                point.y >= rect.top &&
                point.y <= rect.bottom

            );

        }



        /* =====================================================
           BERECHNET SICHERE POSITION
        ===================================================== */

        function getSafeTarget() {


            /*
             * Aktuelle tatsächliche Größe
             * des JA Buttons.
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Größe NEIN.
             */

            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            /*
             * Das Hindernis wird um den
             * Sicherheitsabstand erweitert.
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safetyGap,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safetyGap,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safetyGap,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safetyGap

            };



            /*
             * Wir suchen zufällig eine Position.
             */

            for (
                let i = 0;
                i < 5000;
                i++
            ) {


                const x =

                    screenPadding
                    +
                    Math.random()
                    *
                    (
                        window.innerWidth
                        -
                        noWidth
                        -
                        screenPadding * 2
                    );


                const y =

                    screenPadding
                    +
                    Math.random()
                    *
                    (
                        window.innerHeight
                        -
                        noHeight
                        -
                        screenPadding * 2
                    );



                const candidate = {

                    left: x,

                    top: y,

                    right:
                        x + noWidth,

                    bottom:
                        y + noHeight

                };



                /*
                 * Ist NEIN dort sicher?
                 */

                if (
                    !overlaps(
                        candidate,
                        yesRect,
                        safetyGap
                    )
                ) {

                    return {
                        x,
                        y
                    };

                }

            }


            /*
             * Falls nichts gefunden wurde:
             * ganz oben links versuchen.
             */

            return {

                x: screenPadding,

                y: screenPadding

            };

        }



        /* =====================================================
           FLUGWEG PRÜFEN
        ===================================================== */

        function pathIsSafe(
            start,
            end
        ) {


            const yesRect =
                yesButton.getBoundingClientRect();


            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            /*
             * JA Hindernis erweitern.

             * Dadurch berücksichtigen wir die
             * komplette Größe von NEIN.
             */

            const obstacle = {

                left:
                    yesRect.left
                    -
                    noWidth / 2
                    -
                    safetyGap,

                top:
                    yesRect.top
                    -
                    noHeight / 2
                    -
                    safetyGap,

                right:
                    yesRect.right
                    +
                    noWidth / 2
                    +
                    safetyGap,

                bottom:
                    yesRect.bottom
                    +
                    noHeight / 2
                    +
                    safetyGap

            };



            /*
             * Wir prüfen viele Punkte
             * entlang des Flugweges.
             */

            const steps = 100;


            for (
                let i = 0;
                i <= steps;
                i++
            ) {


                const progress =
                    i / steps;


                const x =

                    start.x
                    +
                    (
                        end.x
                        -
                        start.x
                    )
                    *
                    progress;


                const y =

                    start.y
                    +
                    (
                        end.y
                        -
                        start.y
                    )
                    *
                    progress;



                if (
                    pointInsideRect(
                        { x, y },
                        obstacle
                    )
                ) {

                    return false;

                }

            }


            return true;

        }



        /* =====================================================
           SICHEREN FLUGWEG SUCHEN
        ===================================================== */

        function findFlightPath() {


            /*
             * aktuelle Position
             * Mittelpunkt NEIN
             */

            const currentRect =
                noButton.getBoundingClientRect();


            const start = {

                x:
                    currentRect.left
                    +
                    currentRect.width / 2,

                y:
                    currentRect.top
                    +
                    currentRect.height / 2

            };



            /*
             * 100 zufällige Ziele ausprobieren.
             */

            for (
                let i = 0;
                i < 100;
                i++
            ) {


                const target =
                    getSafeTarget();


                /*
                 * Direkter Weg sicher?
                 */

                if (
                    pathIsSafe(
                        start,
                        {
                            x:
                                target.x
                                +
                                noButton.offsetWidth
                                / 2,

                            y:
                                target.y
                                +
                                noButton.offsetHeight
                                / 2
                        }
                    )
                ) {

                    return {

                        start,

                        end: {

                            x:
                                target.x
                                +
                                noButton.offsetWidth
                                / 2,

                            y:
                                target.y
                                +
                                noButton.offsetHeight
                                / 2

                        }

                    };

                }

            }



            /*
             * Kein direkter Weg gefunden.

             * Wir fliegen außen herum:
             */

            const yesRect =
                yesButton.getBoundingClientRect();


            const noWidth =
                noButton.offsetWidth;

            const noHeight =
                noButton.offsetHeight;



            const margin = 70;



            /*
             * Oberhalb des JA Buttons.
             */

            const topTarget = {

                x:
                    yesRect.left
                    -
                    margin
                    +
                    Math.random()
                    *
                    (
                        yesRect.width
                        +
                        margin * 2
                    ),

                y:
                    Math.max(
                        screenPadding,
                        yesRect.top
                        -
                        noHeight
                        -
                        margin
                    )

            };



            /*
             * Unterhalb des JA Buttons.
             */

            const bottomTarget = {

                x:
                    yesRect.left
                    -
                    margin
                    +
                    Math.random()
                    *
                    (
                        yesRect.width
                        +
                        margin * 2
                    ),

                y:
                    Math.min(
                        window.innerHeight
                        -
                        noHeight
                        -
                        screenPadding,

                        yesRect.bottom
                        +
                        margin
                )

            };



            const chosen =
                Math.random() < 0.5
                    ? topTarget
                    : bottomTarget;



            return {

                start,

                end: {

                    x:
                        Math.max(
                            noWidth / 2,
                            Math.min(
                                window.innerWidth
                                -
                                noWidth / 2,
                                chosen.x
                                +
                                noWidth / 2
                            )
                        ),

                    y:
                        Math.max(
                            noHeight / 2,
                            Math.min(
                                window.innerHeight
                                -
                                noHeight / 2,
                                chosen.y
                                +
                                noHeight / 2
                            )
                        )

                }

            };

        }



        /* =====================================================
           NEIN FLIEGT
        ===================================================== */

        function flyNoButton() {


            /*
             * Flugweg bestimmen.
             */

            const path =
                findFlightPath();


            const start =
                path.start;


            const end =
                path.end;



            /*
             * Flugdauer.

             * Längere Strecke = längerer Flug.
             */

            const distance =

                Math.hypot(
                    end.x - start.x,
                    end.y - start.y
                );


            const duration =

                Math.max(
                    700,
                    Math.min(
                        1800,
                        distance * 2
                    )
                );



            const startTime =
                performance.now();



            /*
             * Animation.
             */

            function animate(
                currentTime
            ) {


                const elapsed =
                    currentTime
                    -
                    startTime;


                let progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );



                /*
                 * Smooth Ease In / Ease Out
                 */

                const eased =

                    progress < 0.5

                        ?

                    2 *
                    progress *
                    progress

                        :

                    1 -
                    Math.pow(
                        -2 * progress + 2,
                        2
                    )
                    /
                    2;



                /*
                 * Aktuelle Position.
                 */

                const x =

                    start.x
                    +
                    (
                        end.x
                        -
                        start.x
                    )
                    *
                    eased;


                const y =

                    start.y
                    +
                    (
                        end.y
                        -
                        start.y
                    )
                    *
                    eased;



                /*
                 * Button positionieren.

                 * FIXED bleibt während des
                 * gesamten Fluges bestehen.
                 */

                noButton.style.left =
                    (
                        x
                        -
                        noButton.offsetWidth / 2
                    )
                    +
                    "px";


                noButton.style.top =
                    (
                        y
                        -
                        noButton.offsetHeight / 2
                    )
                    +
                    "px";



                /*
                 * Kleine Drehbewegung.
                 */

                const rotation =
                    Math.sin(
                        progress
                        *
                        Math.PI
                        *
                        4
                    )
                    *
                    5;


                noButton.style.transform =
                    `rotate(${rotation}deg)`;



                /*
                 * Noch nicht am Ziel?
                 */

                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    /*
                     * Flug beendet.
                     */

                    noButton.style.transform =
                        "rotate(0deg)";


                    isFlying = false;


                    noButton.style.pointerEvents =
                        "auto";

                }

            }


            requestAnimationFrame(
                animate
            );

        }



        /* =====================================================
           NEIN GEKLICKT
        ===================================================== */

        function sayNo() {


            /*
             * Mehrfachklick während Flug verhindern.
             */

            if (
                isFlying
            ) {

                return;

            }


            isFlying = true;

            noButton.style.pointerEvents =
                "none";


            noClicks++;



            /*
             * JA größer machen.
             */

            yesScale *= growthFactor;


            if (
                yesScale > maxYesScale
            ) {

                yesScale =
                    maxYesScale;

            }


            yesButton.style.transform =
                `scale(${yesScale})`;



            /*
             * Text ändern.
             */

            const textIndex =

                Math.min(
                    noClicks,
                    noTexts.length - 1
                );


            noButton.innerText =
                noTexts[textIndex];



            /*
             * Beim ersten Klick:
             *
             * Button exakt von seiner
             * bisherigen Position übernehmen.
             */

            if (
                !hasStartedFlying
            ) {


                const rect =
                    noButton.getBoundingClientRect();


                noButton.style.position =
                    "fixed";


                noButton.style.left =
                    rect.left + "px";


                noButton.style.top =
                    rect.top + "px";


                /*
                 * Unser fixed Button benutzt
                 * die linke obere Ecke.
                 *
                 * Deshalb muss die Ausgangsposition
                 * exakt erhalten bleiben.
                 */

                noButton.style.margin =
                    "0";


                hasStartedFlying = true;

            }



            /*
             * Warten, damit JA seine
             * neue Größe übernommen hat.
             */

            requestAnimationFrame(() => {


                requestAnimationFrame(() => {


                    /*
                     * Jetzt Flug starten.
                     */

                    flyNoButton();

                });

            });

        }



        /* =====================================================
           JA GEKLICKT
        ===================================================== */

        function sayYes() {


            document
                .getElementById("mainCard")
                .style.display =
                "none";


            noButton.style.display =
                "none";


            document
                .getElementById("success")
                .style.display =
                "flex";


            createHearts();

        }



        /* =====================================================
           HERZEN
        ===================================================== */

        function createHearts() {


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞"

            ];


            for (
                let i = 0;
                i < 50;
                i++
            ) {


                setTimeout(() => {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerText =
                        hearts[
                            Math.floor(
                                Math.random()
                                *
                                hearts.length
                            )
                        ];


                    heart.style.left =
                        Math.random()
                        *
                        100
                        +
                        "vw";


                    heart.style.fontSize =
                        (
                            18
                            +
                            Math.random()
                            * 25
                        )
                        +
                        "px";


                    heart.style.animationDuration =
                        (
                            3
                            +
                            Math.random()
                            * 3
                        )
                        +
                        "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 6500);


                }, i * 70);

            }

        }

    </script>

</body>

</html>
